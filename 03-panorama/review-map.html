      <span class="flex items-center gap-1">
        <svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke="#10B981" stroke-width="2" stroke-dasharray="2 4"/></svg>
        数据传递
      </span>
    </div>

    <!-- Flow View -->
    <section x-data="flowView" x-show="$store.review.view === 'flow'" x-transition>

      <!-- Zoom controls + Add Connection button -->
      <div class="flex items-center gap-1 mb-3 no-print" x-show="!isSmallScreen"
           @keydown.escape.window="if (addingConnection) { addingConnection = null; }">
        <button @click="zoomIn()" class="flow-zoom-btn flex items-center justify-center rounded bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-600 dark:text-gray-300 text-sm font-bold">+</button>
        <button @click="zoomOut()" class="flow-zoom-btn flex items-center justify-center rounded bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-600 dark:text-gray-300 text-sm font-bold">&minus;</button>
        <button @click="zoomReset()" class="px-2 h-7 flex items-center justify-center rounded bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-500 dark:text-gray-400 text-xs">Reset</button>
        <span class="text-xs text-gray-400 ml-1" x-text="Math.round(zoom * 100) + '%'"></span>
        <!-- Add Connection button (edit mode only) -->
        <button x-show="$store.review.editMode"
                @click="addingConnection ? (addingConnection = null) : (addingConnection = { sourceId: null, step: 'selectSource' })"
                class="ml-3 px-2 h-7 flex items-center justify-center rounded text-xs font-medium"
                :class="addingConnection ? 'bg-red-100 text-red-600 hover:bg-red-200' : 'bg-blue-100 text-blue-600 hover:bg-blue-200'">
          <span x-text="addingConnection ? '取消连线' : '+ 新建连线'"></span>
        </button>
        <!-- Add-connection status tip -->
        <span x-show="addingConnection && addingConnection.step === 'selectSource'" class="ml-2 text-xs text-blue-500 font-medium">点击起始页面节点</span>
        <span x-show="addingConnection && addingConnection.step === 'selectTarget'" class="ml-2 text-xs text-blue-500 font-medium">点击目标页面节点</span>
      </div>

      <!-- SVG graph (imperative rendering — <template x-for> doesn't work inside SVG namespace) -->
      <div x-show="!isSmallScreen" class="overflow-auto border rounded-lg bg-white dark:bg-gray-800 dark:border-gray-700 relative">
        <svg x-ref="flowSvg" :view-box.camel="viewBox" class="w-full" style="min-height:400px"
             @click="handleSvgClick($event)" @dblclick="handleSvgDblClick($event)">
          <defs>
            <marker id="flow-arrowhead" viewBox="0 0 10 7" refX="10" refY="3.5"
                    markerWidth="10" markerHeight="7" orient="auto-start-reverse" fill="currentColor">
              <polygon points="0 0, 10 3.5, 0 7"/>
            </marker>
          </defs>
          <g x-ref="edgesGroup"></g>
          <g x-ref="nodesGroup"></g>
        </svg>

        <!-- HTML overlays positioned over SVG (for interactive editing elements) -->

        <!-- Connection action bar -->
        <div x-show="selectedEdge && $store.review.editMode" x-transition
             class="absolute z-10" :style="getOverlayStyle(selectedEdge, 'actionBar')" @click.stop>
          <div class="conn-action-bar bg-white dark:bg-gray-800 shadow-lg rounded-lg px-2 py-1 border dark:border-gray-600 flex items-center gap-1 text-xs">
            <select class="border rounded px-1 py-0.5 text-xs flex-1"
                    :value="$store.review.getConnectionType(selectedEdge)"
                    @change="(function(el, s, eid, comp) { s.updateEdit('connectionTypes', eid, el.value); comp.computeLayout(); })($event.target, $store.review, selectedEdge, $data)">
              <option value="navigation">导航跳转</option>
              <option value="redirect">自动跳转</option>
              <option value="back">返回</option>
              <option value="conditional">条件跳转</option>
              <option value="data">数据传递</option>
            </select>
            <button class="px-1.5 py-0.5 rounded bg-red-50 hover:bg-red-100 text-red-600"
                    title="删除连线"
                    @click.stop="deleteConnection(selectedEdge)">&#x2715;</button>
          </div>
        </div>

        <!-- Label inline edit overlay -->
        <div x-show="editingLabel" x-transition class="absolute z-10"
             :style="getOverlayStyle(editingLabel, 'labelEdit')" @click.stop>
          <input type="text" x-ref="labelEditInput"
                 class="border border-blue-400 rounded px-1 text-xs text-center bg-white"
                 style="width:120px; height:24px"
                 @blur="saveLabelEdit($event.target.value)"
                 @keydown.enter="$event.target.blur()"
                 @keydown.escape.stop="editingLabel = null"/>
        </div>

        <!-- Node name inline edit overlay -->
        <div x-show="editingNodeName" x-transition class="absolute z-10"
             :style="getOverlayStyle(editingNodeName, 'nameEdit')" @click.stop>
          <input type="text" x-ref="nameEditInput"
                 class="border border-blue-400 rounded px-1 text-xs text-center bg-white"
                 style="width:140px; height:22px"
                 @blur="saveNameEdit($event.target.value)"
                 @keydown.enter="$event.target.blur()"
                 @keydown.escape.stop="editingNodeName = null"/>
        </div>

        <!-- Add-connection dialog overlay -->
        <div x-show="addingConnection && addingConnection.step === 'confirmDialog'" x-transition
             class="absolute z-10" :style="getOverlayStyle(addingConnection && addingConnection.targetId, 'addConn')" @click.stop>
          <div class="bg-white shadow-lg rounded-lg p-2 border text-xs space-y-1" style="width:200px">
            <div class="flex items-center gap-1">
              <label class="text-gray-500 w-10">类型</label>
              <select x-ref="newConnType" class="flex-1 border rounded px-1 py-0.5 text-xs">
                <option value="navigation" selected>导航跳转</option>
                <option value="redirect">自动跳转</option>
                <option value="back">返回</option>
                <option value="conditional">条件跳转</option>
                <option value="data">数据传递</option>
              </select>
            </div>
            <div class="flex items-center gap-1">
              <label class="text-gray-500 w-10">标签</label>
              <input x-ref="newConnLabel" type="text" placeholder="操作描述" class="flex-1 border rounded px-1 py-0.5 text-xs"/>
            </div>
            <div class="flex justify-end gap-1 pt-1">
              <button @click="addingConnection = null" class="px-2 py-0.5 rounded bg-gray-100 hover:bg-gray-200 text-gray-600">取消</button>
              <button @click="confirmNewConnection()" class="px-2 py-0.5 rounded bg-blue-500 hover:bg-blue-600 text-white">确认</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Small screen fallback -->
      <div x-show="isSmallScreen" class="space-y-1 p-4">
        <div class="text-sm text-gray-500 dark:text-gray-400 mb-2">Flow connections (small screen view)</div>
        <template x-for="conn in getLinearConnections()" :key="conn.id">
          <div class="flex items-center gap-2 py-1 text-sm">
            <span class="font-medium" x-text="conn.fromName"></span>
            <span class="text-gray-400">&rarr;</span>
            <span class="text-gray-500 italic text-xs" x-text="conn.label"></span>
            <span class="text-gray-400">&rarr;</span>
            <span class="font-medium" x-text="conn.toName"></span>
          </div>
        </template>
      </div>
    </section>

    <!-- Detail View (Phase 2) — default view -->
    <section x-data="detailView" x-show="$store.review.view === 'detail'" x-transition>

      <!-- Global controls bar -->
      <div class="flex items-center justify-between mb-4 no-print">
        <div class="flex items-center gap-2">
          <button @click="expandAll()"
            class="px-3 py-1.5 rounded-md text-sm font-medium bg-gray-100 text-gray-600 hover:bg-gray-200 dark:bg-gray-700 dark:text-gray-300 dark:hover:bg-gray-600 transition-colors">
            展开全部
          </button>
          <button @click="collapseAll()"
            class="px-3 py-1.5 rounded-md text-sm font-medium bg-gray-100 text-gray-600 hover:bg-gray-200 dark:bg-gray-700 dark:text-gray-300 dark:hover:bg-gray-600 transition-colors">
            折叠全部
          </button>
        </div>
        <span class="text-sm text-gray-500">
          共 <span x-text="$store.review.data?.pages?.length || 0"></span> 个页面
        </span>
      </div>

      <!-- Page card iteration -->
      <template x-for="page in $store.review.data.pages" :key="page.id">
        <div class="detail-card bg-white dark:bg-gray-800" :id="'page-card-' + page.id">

          <!-- Page header: dark bg, left screenshot + right info -->
          <div class="detail-page-header">
            <!-- Page screenshot: view mode = lightbox click, edit mode = file picker (EDIT-DETAIL-09) -->
            <div class="w-[200px] flex-shrink-0">
              <div x-show="!$store.review.editMode" class="cursor-pointer"
                   @click="openLightbox($store.review.getScreenshotSrc(page.id, 'default'))">
                <img :src="$store.review.getScreenshotSrc(page.id, 'default')"
                     class="w-full rounded shadow-sm screenshot-thumb"
                     :alt="page.name">
              </div>
              <label x-show="$store.review.editMode"
                     class="block cursor-pointer editable-hint relative"
                     @mouseenter="$store.review.setPasteTarget('page', page.id, 'default'); $el.classList.add('screenshot-paste-target')"
                     @mouseleave="$store.review.clearPasteTarget(); $el.classList.remove('screenshot-paste-target')"
                     @dragover.prevent="$el.classList.add('screenshot-drop-active')"
                     @dragleave="$el.classList.remove('screenshot-drop-active')"
                     @drop.prevent="$el.classList.remove('screenshot-drop-active'); $store.review.handleScreenshotDrop($event, page.id, 'default')">
                <img :src="$store.review.getScreenshotSrc(page.id, 'default')"
                     class="w-full rounded shadow-sm screenshot-thumb"
                     :alt="page.name">
                <div class="absolute inset-0 bg-black/40 rounded flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity">
                  <span class="text-white text-xs">粘贴 / 拖拽 / 点击替换</span>
                </div>
                <input type="file" accept="image/*" class="hidden"
                       @change="$store.review.handleScreenshotUpload($event, page.id, 'default')">
              </label>
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="text-lg font-bold text-white" x-text="page.name"></h3>
              <!-- Page summary: view mode = text, edit mode = textarea (EDIT-DETAIL-01) -->
              <p x-show="!$store.review.editMode" class="text-gray-300 text-sm mt-1"
                 x-text="$store.review.getPageSummary(page.id)"></p>
              <template x-if="$store.review.editMode">
                <textarea
                  :value="$store.review.getPageSummary(page.id)"
                  @blur="$store.review.updateEdit('pageSummaries', page.id, $event.target.value)"
                  @keydown.escape="$event.target.blur()"
                  class="w-full bg-gray-700 border border-gray-600 rounded px-2 py-1 text-gray-200 text-sm resize-y mt-1"
                  rows="2"
                  placeholder="输入页面功能概述..."></textarea>
              </template>
            </div>
          </div>

          <!-- Page-level annotations (v2.1) -->
          <template x-if="$store.review.hasAnyPageAnnotation(page.id) || $store.review.editMode">
            <div class="px-4 py-3 bg-gray-50 dark:bg-gray-750 border-b border-gray-200 dark:border-gray-700">
              <h4 class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">页面功能说明</h4>
              <div class="space-y-1">
                <template x-for="block in ANNOTATION_BLOCKS" :key="block.key">
                  <div x-show="$store.review.getPageAnnotation(page.id, block.key) || $store.review.editMode">
                    <!-- View mode -->
                    <div x-show="!$store.review.editMode && $store.review.getPageAnnotation(page.id, block.key)"
                         class="annotation-block"
                         :style="'border-left-color:' + ($store.review.darkMode ? block.darkBorder : block.border) + ';background:' + ($store.review.darkMode ? block.darkBg : block.bg)">
                      <div class="annotation-block-title" :style="'color:' + ($store.review.darkMode ? block.darkBorder : block.border)">
                        <span x-text="block.icon"></span> <span x-text="block.title"></span>
                      </div>
                      <div class="annotation-block-body text-gray-700 dark:text-gray-300"
                           x-html="renderMarkdown($store.review.getPageAnnotation(page.id, block.key))"></div>
                    </div>
                    <!-- Edit mode -->
                    <div x-show="$store.review.editMode" class="annotation-block"
                         :style="'border-left-color:' + ($store.review.darkMode ? block.darkBorder : block.border) + ';background:' + ($store.review.darkMode ? block.darkBg : block.bg)">
                      <div class="annotation-block-title" :style="'color:' + ($store.review.darkMode ? block.darkBorder : block.border)">
                        <span x-text="block.icon"></span> <span x-text="block.title"></span>
                      </div>
                      <textarea
                        :value="$store.review.getPageAnnotation(page.id, block.key)"
                        @blur="$store.review.updateEdit('annotations', 'pageAnnot_' + page.id + '_' + block.key, $event.target.value)"
                        @keydown.escape="$event.target.blur()"
                        class="w-full bg-white/60 dark:bg-gray-800/60 border border-gray-300 dark:border-gray-600 rounded px-2 py-1 text-sm text-gray-700 dark:text-white resize-y focus:ring-1 focus:ring-primary dark:placeholder-gray-400"
                        rows="2"
                        :placeholder="'输入' + block.title + '...'"></textarea>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>

          <!-- Feature table: v2.1 layout with annotation blocks -->
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50 dark:bg-gray-700 text-xs text-gray-500 dark:text-gray-400 uppercase tracking-wider">
                <tr class="hidden md:table-row">
                  <th class="w-[130px] px-3 py-2 text-left font-medium">截图</th>
                  <th class="px-3 py-2 text-left font-medium">功能点</th>
                  <th class="w-[40px] px-1 py-2 text-center font-medium">批注</th>
                  <th x-show="$store.review.editMode" class="w-[80px] px-2 py-2 text-center font-medium">操作</th>
                </tr>
              </thead>
              <!-- Feature rows: each feature wrapped in its own tbody for comment panel pairing -->
              <template x-for="(feat, featIdx) in getEffectiveFeatures(page.id)" :key="feat.id">
                <tbody>
                  <tr class="detail-feature-row">
                    <!-- Screenshot cell (EDIT-DETAIL-05 / CAPTURE-03) -->
                    <td class="px-3 py-2 align-top">
                      <!-- View mode: click for lightbox -->
                      <div x-show="!$store.review.editMode">
                        <template x-if="getFeatureScreenshot(page.id, feat.id)">
                          <img :src="getFeatureScreenshot(page.id, feat.id)"
                               class="w-[140px] max-h-[160px] object-contain rounded cursor-pointer screenshot-thumb"
                               @click="openLightbox(getFeatureScreenshot(page.id, feat.id))"
                               :alt="$store.review.getFeature(page.id, feat.id, 'name')">
                        </template>
                        <template x-if="!getFeatureScreenshot(page.id, feat.id)">
                          <div class="w-[140px] h-[80px] border-2 border-dashed border-gray-200 rounded flex items-center justify-center">
                            <svg class="w-6 h-6 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                          </div>
                        </template>
                      </div>
                      <!-- Edit mode: click for file picker / drag / paste to replace -->
                      <label x-show="$store.review.editMode"
                             class="block cursor-pointer editable-hint relative w-[140px] max-h-[160px]"
                             @mouseenter="$store.review.setPasteTarget('feature', page.id, feat.id); $el.classList.add('screenshot-paste-target')"
                             @mouseleave="$store.review.clearPasteTarget(); $el.classList.remove('screenshot-paste-target')"
                             @dragover.prevent="$el.classList.add('screenshot-drop-active')"
                             @dragleave="$el.classList.remove('screenshot-drop-active')"
                             @drop.prevent="$el.classList.remove('screenshot-drop-active'); handleFeatureScreenshotDrop($event, page.id, feat.id)">
                        <template x-if="getFeatureScreenshot(page.id, feat.id)">
                          <img :src="getFeatureScreenshot(page.id, feat.id)"
                               class="w-full object-contain rounded screenshot-thumb">
                        </template>
                        <template x-if="!getFeatureScreenshot(page.id, feat.id)">
                          <div class="w-full h-[80px] border-2 border-dashed border-gray-300 rounded flex items-center justify-center">
                            <span class="text-xs text-gray-400 text-center px-1">粘贴 / 点击添加</span>
                          </div>
                        </template>
                        <div class="absolute inset-0 bg-black/40 rounded flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity">
                          <span class="text-white text-xs">粘贴 / 拖拽 / 点击替换</span>
                        </div>
                        <input type="file" accept="image/*" class="hidden"
                               @change="handleFeatureScreenshotUpload($event, page.id, feat.id)">
                      </label>
                    </td>
                    <!-- Feature name + description cell with expand toggle (EDIT-DETAIL-02/03) -->
                    <td class="px-3 py-2 align-top">
                      <div class="flex items-start gap-1">
                        <button @click="toggleExpand(feat.id)"
                          class="mt-0.5 flex-shrink-0 w-5 h-5 flex items-center justify-center text-gray-400 hover:text-gray-600 transition-colors rounded">
                          <svg class="w-4 h-4 transition-transform duration-200"
                               :class="isExpanded(feat.id) ? 'rotate-90' : ''"
                               fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                          </svg>
                        </button>
                        <div class="flex-1 min-w-0">
                          <span x-show="!$store.review.editMode" class="font-medium text-gray-900 dark:text-gray-100"
                                x-text="$store.review.getFeature(page.id, feat.id, 'name')"></span>
                          <input x-show="$store.review.editMode" type="text"
                                 :value="$store.review.getFeature(page.id, feat.id, 'name')"
                                 @blur="(function(el, s, pid, fid) { var k = pid + '_' + fid; var ex = Object.assign({}, s.edits.features[k] || {}); ex.name = el.value; s.updateEdit('features', k, ex); })($event.target, $store.review, page.id, feat.id)"
                                 @keydown.escape="$event.target.blur()"
                                 class="w-full bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded px-1.5 py-0.5 text-sm font-medium text-gray-900 dark:text-white focus:ring-1 focus:ring-primary focus:border-primary">
                          <!-- One-line description (always visible) -->
                          <p x-show="!$store.review.editMode" class="text-sm text-gray-500 dark:text-gray-400 mt-0.5"
                             x-text="$store.review.getFeature(page.id, feat.id, 'description')"></p>
                          <textarea x-show="$store.review.editMode"
                                    :value="$store.review.getFeature(page.id, feat.id, 'description')"
                                    @blur="(function(el, s, pid, fid) { var k = pid + '_' + fid; var ex = Object.assign({}, s.edits.features[k] || {}); ex.description = el.value; s.updateEdit('features', k, ex); })($event.target, $store.review, page.id, feat.id)"
                                    @keydown.escape="$event.target.blur()"
                                    class="w-full mt-1 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded px-2 py-1 text-sm text-gray-700 dark:text-white resize-y focus:ring-1 focus:ring-primary dark:placeholder-gray-400"
                                    rows="1"
                                    placeholder="功能一句话概述..."></textarea>
                        </div>
                      </div>
                    </td>
                    <!-- Comment button cell (EDIT-DETAIL-10, always visible) -->
                    <td class="px-1 py-2 align-top text-center">
                      <button @click="toggleComments(feat.id)"
                              class="relative p-1 text-gray-400 hover:text-blue-500 transition-colors rounded"
                              title="批注">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                        </svg>
                        <span x-show="$store.review.getFeatureCommentCount(page.id, feat.id) > 0"
                              x-text="$store.review.getFeatureCommentCount(page.id, feat.id)"
                              class="absolute -top-1 -right-1 bg-blue-500 text-white text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center leading-none"></span>
                      </button>
                    </td>
                    <!-- Actions cell: delete + reorder (EDIT-DETAIL-07/08) -->
                    <td x-show="$store.review.editMode" class="px-2 py-2 align-top text-center">
                      <div class="flex flex-col items-center gap-0.5">
                        <button @click="moveFeature(page.id, feat.id, -1)"
                                :disabled="featIdx === 0"
                                :class="featIdx === 0 ? 'text-gray-300 cursor-not-allowed' : 'text-gray-500 hover:text-gray-700'"
                                class="w-6 h-6 flex items-center justify-center rounded transition-colors"
                                title="上移">&#9650;</button>
                        <button @click="moveFeature(page.id, feat.id, 1)"
                                :disabled="featIdx === getEffectiveFeatures(page.id).length - 1"
                                :class="featIdx === getEffectiveFeatures(page.id).length - 1 ? 'text-gray-300 cursor-not-allowed' : 'text-gray-500 hover:text-gray-700'"
                                class="w-6 h-6 flex items-center justify-center rounded transition-colors"
                                title="下移">&#9660;</button>
                        <button @click="deleteFeature(page.id, feat.id)"
                                class="w-6 h-6 flex items-center justify-center rounded text-red-400 hover:text-red-600 hover:bg-red-50 transition-colors mt-1"
                                title="删除">&#10005;</button>
                      </div>
                    </td>
                  </tr>
                  <!-- Feature-level annotation blocks (v2.1, shown when expanded) -->
                  <tr x-show="isExpanded(feat.id) && ($store.review.hasAnyFeatureAnnotation(page.id, feat.id) || $store.review.editMode)" x-transition>
                    <td :colspan="$store.review.editMode ? 4 : 3" class="px-3 py-2 bg-white dark:bg-gray-800">
                      <div class="ml-6 space-y-1">
                        <template x-for="block in ANNOTATION_BLOCKS" :key="block.key">
                          <div x-show="$store.review.getFeatureAnnotation(page.id, feat.id, block.key) || $store.review.editMode">
                            <!-- View mode -->
                            <div x-show="!$store.review.editMode && $store.review.getFeatureAnnotation(page.id, feat.id, block.key)"
                                 class="annotation-block"
                                 :style="'border-left-color:' + ($store.review.darkMode ? block.darkBorder : block.border) + ';background:' + ($store.review.darkMode ? block.darkBg : block.bg)">
                              <div class="annotation-block-title" :style="'color:' + ($store.review.darkMode ? block.darkBorder : block.border)">
                                <span x-text="block.icon"></span> <span x-text="block.title"></span>
                              </div>
                              <div class="annotation-block-body text-gray-700 dark:text-gray-300"
                                   x-html="renderMarkdown($store.review.getFeatureAnnotation(page.id, feat.id, block.key))"></div>
                            </div>
                            <!-- Edit mode -->
                            <div x-show="$store.review.editMode" class="annotation-block"

  <!-- ===== ZONE 6: Utilities + ScreenshotDB JS ===== -->

  <script>
    // --- Utility functions ---

    function generateId() {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      return 'xxxx-xxxx-xxxx'.replace(/x/g, function() {
        return Math.floor(Math.random() * 16).toString(16);
      });
    }

    function formatDate(isoString) {
      if (!isoString) return '';
      var d = new Date(isoString);
      return d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function blobUrlToDataUrl(blobUrl) {
      return new Promise(function(resolve, reject) {
        var img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var maxDim = 1200;
          var w = img.naturalWidth;
          var h = img.naturalHeight;
          // Scale down if larger than maxDim on either side
          if (w > maxDim || h > maxDim) {
            var scale = Math.min(maxDim / w, maxDim / h);
            w = Math.round(w * scale);
            h = Math.round(h * scale);
          }
          canvas.width = w;
          canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          // Use JPEG at 70% quality for significant size reduction
          resolve(canvas.toDataURL('image/jpeg', 0.7));
        };
        img.onerror = reject;
        img.src = blobUrl;
      });
    }
    // --- ScreenshotDB: IndexedDB wrapper for persistent screenshot storage ---

    var ScreenshotDB = {
      DB_NAME: 'review-map-screenshots',
      DB_VERSION: 1,
      STORE_NAME: 'images',
      _db: null,
      _available: null,

      async isAvailable() {
        if (this._available !== null) return this._available;
        try {
          var testName = '__rm_idb_test__';
          await new Promise(function(resolve, reject) {
            var req = indexedDB.open(testName, 1);
            req.onupgradeneeded = function(e) { e.target.result.createObjectStore('test'); };
            req.onsuccess = function(e) {
              e.target.result.close();
              indexedDB.deleteDatabase(testName);
              resolve();
            };
            req.onerror = function() { reject(); };
          });
          this._available = true;
        } catch (e) {
          this._available = false;
        }
        return this._available;
      },

      async open() {
        if (this._db) return this._db;
        var self = this;
        return new Promise(function(resolve, reject) {
          var req = indexedDB.open(self.DB_NAME, self.DB_VERSION);
          req.onupgradeneeded = function(e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains(self.STORE_NAME)) {
              db.createObjectStore(self.STORE_NAME);
            }
          };
          req.onsuccess = function(e) { self._db = e.target.result; resolve(self._db); };
          req.onerror = function(e) { reject(e.target.error); };
        });
      },

      async save(key, blob) {
        var db = await this.open();
        var storeName = this.STORE_NAME;
        return new Promise(function(resolve, reject) {
          var tx = db.transaction(storeName, 'readwrite');
          tx.objectStore(storeName).put(blob, key);
          tx.oncomplete = function() { resolve(); };
          tx.onerror = function(e) { reject(e.target.error); };
        });
      },

      async load(key) {
        var db = await this.open();
        var storeName = this.STORE_NAME;
        return new Promise(function(resolve, reject) {
          var tx = db.transaction(storeName, 'readonly');
          var req = tx.objectStore(storeName).get(key);
          req.onsuccess = function() { resolve(req.result || null); };
          req.onerror = function(e) { reject(e.target.error); };
        });
      },

      async getAllKeys() {
        var db = await this.open();
        var storeName = this.STORE_NAME;
        return new Promise(function(resolve, reject) {
          var tx = db.transaction(storeName, 'readonly');
          var req = tx.objectStore(storeName).getAllKeys();
          req.onsuccess = function() { resolve(req.result || []); };
          req.onerror = function(e) { reject(e.target.error); };
        });
      },

      async delete(key) {
        var db = await this.open();
        var storeName = this.STORE_NAME;
        return new Promise(function(resolve, reject) {
          var tx = db.transaction(storeName, 'readwrite');
          tx.objectStore(storeName).delete(key);
          tx.oncomplete = function() { resolve(); };
          tx.onerror = function(e) { reject(e.target.error); };
        });
      },

      async clear() {
        var db = await this.open();
        var storeName = this.STORE_NAME;
        return new Promise(function(resolve, reject) {
          var tx = db.transaction(storeName, 'readwrite');
          tx.objectStore(storeName).clear();
          tx.oncomplete = function() { resolve(); };
          tx.onerror = function(e) { reject(e.target.error); };
        });
      },
    };

    // --- ANNOTATION_BLOCKS: v2.1 Eight-category annotation rendering config ---
    var ANNOTATION_BLOCKS = [
      { key: 'overview',           title: '功能概述与逻辑',     icon: '📋', border: '#3B82F6', bg: '#EFF6FF', darkBg: '#1E3A5F', darkBorder: '#60A5FA' },
      { key: 'featureBreakdown',   title: '功能划分与优先级',   icon: '🧩', border: '#8B5CF6', bg: '#F5F3FF', darkBg: '#2E1065', darkBorder: '#A78BFA' },
      { key: 'resourceAndState',   title: '资源、状态与显示',   icon: '🔄', border: '#10B981', bg: '#ECFDF5', darkBg: '#064E3B', darkBorder: '#34D399' },
      { key: 'feedback',           title: '交互反馈与通知',     icon: '💬', border: '#F59E0B', bg: '#FFFBEB', darkBg: '#451A03', darkBorder: '#FBBF24' },
      { key: 'edgeCases',          title: '边界与异常处理',     icon: '⚠️', border: '#EF4444', bg: '#FEF2F2', darkBg: '#450A0A', darkBorder: '#F87171' },
      { key: 'interactionDesign',  title: '交互预期',           icon: '🎨', border: '#EC4899', bg: '#FDF2F8', darkBg: '#500724', darkBorder: '#F472B6' },
      { key: 'contentFill',        title: '内容填充',           icon: '📝', border: '#6366F1', bg: '#EEF2FF', darkBg: '#1E1B4B', darkBorder: '#818CF8' },
      { key: 'testSuggestions',    title: '测试建议',           icon: '🧪', border: '#14B8A6', bg: '#F0FDFA', darkBg: '#042F2E', darkBorder: '#2DD4BF' }
    ];

    // --- renderMarkdown: Lightweight Markdown subset renderer ---
    // Supports: **bold**, unordered lists (- or *), line breaks as <p>
    function renderMarkdown(text) {
      if (!text) return '';
      // Escape HTML entities first (prevent XSS)
      var html = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      // Bold: **text**
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

      // Split into lines for list processing
      var lines = html.split('\n');
      var result = [];
      var inList = false;

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        var listMatch = line.match(/^[-*]\s+(.+)/);
        if (listMatch) {
          if (!inList) { result.push('<ul class="list-disc list-inside ml-2 space-y-0.5">'); inList = true; }
          result.push('<li>' + listMatch[1] + '</li>');
        } else {
          if (inList) { result.push('</ul>'); inList = false; }
          if (line.trim()) {
            result.push('<p>' + line + '</p>');
          }
        }
      }
      if (inList) { result.push('</ul>'); }

      return result.join('');
    }
  </script>

  <!-- ===== ZONE 7: Alpine.store('review') JS ===== -->
  <!-- ===== ZONE 8: Alpine.data() Components JS ===== -->

  <script>
    document.addEventListener('alpine:init', function() {

      // ===== ZONE 7: Global Store =====
      Alpine.store('review', {
        // --- Core state ---
        data: null,
        view: 'detail',
        editMode: false,
        selectedPageId: null,
        idbAvailable: false,
        toastMessage: '',
        toastShown: {},
        lightboxSrc: '',
        lightboxOpen: false,
        _key: '',
        _toastTimer: null,
        darkMode: document.documentElement.classList.contains('dark'),
        _pasteTarget: null,

        toggleDarkMode() {
          this.darkMode = !this.darkMode;
          if (this.darkMode) {
            document.documentElement.classList.add('dark');
            localStorage.setItem('review-map-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            localStorage.setItem('review-map-theme', 'light');
          }
        },

        handleGlobalKeydown(event) {
          if (event.isComposing) return;
          // Ctrl+S / Cmd+S → save HTML (works even in text fields)
          if ((event.ctrlKey || event.metaKey) && event.key === 's') {
            event.preventDefault();
            if (this.hasEdits) this.saveHTML();
            return;
          }
          if (event.target.matches('input, select, textarea, [contenteditable]')) return;
          if (event.ctrlKey || event.metaKey || event.altKey) return;
          var key = event.key;
          if (key === 'Escape') {
            if (this.lightboxOpen) { this.closeLightbox(); }
            else if (this.editMode) { this.editMode = false; }
            event.preventDefault();
          } else if (key === 'e' || key === 'E') {
            this.editMode = !this.editMode;
            event.preventDefault();
          } else if (key === 'd' || key === 'D') {
            this.toggleDarkMode();
            event.preventDefault();
          } else if (key === '1') {
            this.view = 'flow';
            event.preventDefault();
          } else if (key === '2') {
            this.view = 'detail';
            event.preventDefault();
          } else if (key === '3') {
            this.view = 'journey';
            event.preventDefault();
          }
        },

        // --- Edits overlay (all v2.1 sub-keys initialized) ---
        edits: {
          screenshots: {},
          screenshotKeys: {},
          pageSummaries: {},
          features: {},
          featureScreenshots: {},
          newFeatures: {},
          deletedFeatures: {},
          featureOrder: {},
          featureComments: {},
          connectionLabels: {},
          connectionTypes: {},
          newConnections: [],
          deletedConnections: {},
          pageDisplayNames: {},
          journeys: {},
          journeyComments: {},
          comments: {},
          annotations: {},
        },

        // --- Store init (called automatically by Alpine) ---
        init() {
          try {
            var raw = document.getElementById('map-data').textContent;
            this.data = JSON.parse(raw);
          } catch (e) {
            this.data = { metadata: { projectName: 'unknown' }, pages: [], connections: [], journeys: [] };
          }
          this._key = 'reviewMapEdits_' + (this.data.metadata.projectName || 'default');
          this._loadEdits();
          this._detectStorage();
          this._registerPasteListener();
        },

        // --- Clipboard paste support for screenshot replacement ---
        setPasteTarget(type, id1, id2) {
          this._pasteTarget = { type: type, id1: id1, id2: id2 || null };
        },
        clearPasteTarget() {
          this._pasteTarget = null;
        },
        _registerPasteListener() {
          var self = this;
          document.addEventListener('paste', function(event) {
            if (!self.editMode || !self._pasteTarget) return;
            var items = event.clipboardData && event.clipboardData.items;
            if (!items) return;
            var imageFile = null;
            for (var i = 0; i < items.length; i++) {
              if (items[i].type.indexOf('image/') === 0) {
                imageFile = items[i].getAsFile();
                break;
              }
            }
            if (!imageFile) return;
            event.preventDefault();
            var target = self._pasteTarget;
            if (target.type === 'page') {
              self._saveScreenshotBlob(imageFile, target.id1, target.id2 || 'default');
            } else if (target.type === 'feature') {
              self._saveFeatureScreenshot(imageFile, target.id1, target.id2);
            }
            self.showToast('\u2705 \u5DF2\u7C98\u8D34\u622A\u56FE');
          });
        },

        // --- Load edits from localStorage, merge with defaults ---
        _loadEdits() {
          try {
            var saved = JSON.parse(localStorage.getItem(this._key) || '{}');
            this.edits = {
              screenshots: {},
              screenshotKeys: saved.screenshotKeys || {},
              pageSummaries: saved.pageSummaries || {},
              features: saved.features || {},
              featureScreenshots: {},
              newFeatures: saved.newFeatures || {},
              deletedFeatures: saved.deletedFeatures || {},
              featureOrder: saved.featureOrder || {},
              featureComments: saved.featureComments || {},
              connectionLabels: saved.connectionLabels || {},
              connectionTypes: saved.connectionTypes || {},
              newConnections: saved.newConnections || [],
              deletedConnections: saved.deletedConnections || {},
              pageDisplayNames: saved.pageDisplayNames || {},
              journeys: saved.journeys || {},
              journeyComments: saved.journeyComments || {},
              comments: saved.comments || {},
              annotations: saved.annotations || {},
            };
          } catch (e) {
            /* ignore corrupt data */
          }
        },

        // --- Detect IndexedDB availability and restore persisted screenshots ---
        async _detectStorage() {
          this.idbAvailable = await ScreenshotDB.isAvailable();
          if (this.idbAvailable) {
            await this._restoreScreenshots();
          }
        },

        // --- Restore screenshots from IndexedDB on page load ---
        async _restoreScreenshots() {
          try {
            var keys = await ScreenshotDB.getAllKeys();
            for (var i = 0; i < keys.length; i++) {
              var key = keys[i];
              var blob = await ScreenshotDB.load(key);
              if (!blob) continue;
              var blobUrl = URL.createObjectURL(blob);
              // Key format: pageId__stateName (page) or feat__pageId__featureId (feature)
              if (typeof key === 'string' && key.indexOf('feat__') === 0) {
                var featureKey = key.replace('feat__', '');
                var fss = Object.assign({}, this.edits.featureScreenshots);
                fss[featureKey] = blobUrl;
                var fsk = Object.assign({}, this.edits.screenshotKeys);
                fsk[key] = true;
                this.edits = Object.assign({}, this.edits, {
                  featureScreenshots: fss,
                  screenshotKeys: fsk,
                });
              } else {
                var parts = String(key).split('__');
                var pageId = parts[0];
                var stateName = parts[1] || 'default';
                var pss = Object.assign({}, this.edits.screenshots);
                var pageStates = Object.assign({}, pss[pageId] || {});
                pageStates[stateName] = blobUrl;
                pss[pageId] = pageStates;
                var psk = Object.assign({}, this.edits.screenshotKeys);
                psk[key] = true;
                this.edits = Object.assign({}, this.edits, {
                  screenshots: pss,
                  screenshotKeys: psk,
                });
              }
            }
          } catch (e) { /* silent */ }
        },

        // --- Save a screenshot file: update UI + persist to IndexedDB ---
        async _saveScreenshotBlob(file, pageId, stateName) {
          var blobUrl = URL.createObjectURL(file);
          var key = stateName || 'default';
          var idbKey = pageId + '__' + key;

          // Update UI immediately (immutable)
          var ss = Object.assign({}, this.edits.screenshots);
          var pageStates = Object.assign({}, ss[pageId] || {});
          pageStates[key] = blobUrl;
          ss[pageId] = pageStates;
          this.edits = Object.assign({}, this.edits, { screenshots: ss });

          // Persist to IndexedDB if available
          if (this.idbAvailable) {
            try {
              await ScreenshotDB.save(idbKey, file);
              var sk = Object.assign({}, this.edits.screenshotKeys);
              sk[idbKey] = true;

        // --- Merge all edits into a deep-cloned data object (reusable core) ---

        async _mergeEditsIntoData() {
          var exported = JSON.parse(JSON.stringify(this.data));

          // Apply page summaries
          var summaryKeys = Object.keys(this.edits.pageSummaries);
          for (var si = 0; si < summaryKeys.length; si++) {
            var pageId = summaryKeys[si];
            var page = exported.pages.find(function(p) { return p.id === pageId; });
            if (page) page.summary = this.edits.pageSummaries[pageId];
          }

          // Apply feature edits
          var featureKeys = Object.keys(this.edits.features);
          for (var fi = 0; fi < featureKeys.length; fi++) {
            var parts = featureKeys[fi].split('_');
            var fPageId = parts[0];
            var fFeatureId = parts.slice(1).join('_');
            var fPage = exported.pages.find(function(p) { return p.id === fPageId; });
            if (fPage && fPage.features) {
              var feat = fPage.features.find(function(f) { return f.id === fFeatureId; });
              if (feat) {
                Object.assign(feat, this.edits.features[featureKeys[fi]]);
              }
            }
          }

          // Apply page display names
          var nameKeys = Object.keys(this.edits.pageDisplayNames);
          for (var ni = 0; ni < nameKeys.length; ni++) {
            var nPage = exported.pages.find(function(p) { return p.id === nameKeys[ni]; });
            if (nPage) nPage.name = this.edits.pageDisplayNames[nameKeys[ni]];
          }

          // Apply connection edits
          var connLabelKeys = Object.keys(this.edits.connectionLabels);
          for (var cli = 0; cli < connLabelKeys.length; cli++) {
            var conn = exported.connections.find(function(c) { return c.id === connLabelKeys[cli]; });
            if (conn) conn.label = this.edits.connectionLabels[connLabelKeys[cli]];
          }
          var connTypeKeys = Object.keys(this.edits.connectionTypes);
          for (var cti = 0; cti < connTypeKeys.length; cti++) {
            var conn2 = exported.connections.find(function(c) { return c.id === connTypeKeys[cti]; });
            if (conn2) conn2.type = this.edits.connectionTypes[connTypeKeys[cti]];
          }

          // Apply deleted connections
          var delConnKeys = Object.keys(this.edits.deletedConnections);
          exported.connections = exported.connections.filter(function(c) {
            return !delConnKeys.includes(c.id);
          });

          // Append new connections
          if (this.edits.newConnections.length > 0) {
            exported.connections = exported.connections.concat(this.edits.newConnections);
          }

          // Apply journey edits (enhanced)
          if (exported.journeys) {
            var journeyKeys = Object.keys(this.edits.journeys);
            // First pass: update existing journeys
            for (var ji = 0; ji < journeyKeys.length; ji++) {
              var jk = journeyKeys[ji];
              var jEdits = this.edits.journeys[jk];
              var jIdx = parseInt(jk, 10);
              if (jEdits._deleted || jEdits._isNew) continue;
              if (exported.journeys[jIdx]) {
                if (jEdits.name !== undefined) exported.journeys[jIdx].name = jEdits.name;
                if (jEdits.goal !== undefined) exported.journeys[jIdx].goal = jEdits.goal;
                if (jEdits.steps) exported.journeys[jIdx].steps = jEdits.steps;
              }
            }
            // Second pass: append new journeys
            for (var ji2 = 0; ji2 < journeyKeys.length; ji2++) {
              var jk2 = journeyKeys[ji2];
              var jEdits2 = this.edits.journeys[jk2];
              if (jEdits2._isNew) {
                var nj = { name: jEdits2.name || '', goal: jEdits2.goal || '', steps: jEdits2.steps || [] };
                exported.journeys.push(nj);
              }
            }
            // Third pass: filter deleted journeys (reverse to preserve indices)
            for (var ji3 = exported.journeys.length - 1; ji3 >= 0; ji3--) {
              var jEdits3 = this.edits.journeys[String(ji3)];
              if (jEdits3 && jEdits3._deleted) {
                exported.journeys.splice(ji3, 1);
              }
            }
          }

          // Apply journey comments to export
          var jcKeys = Object.keys(this.edits.journeyComments);
          for (var jci = 0; jci < jcKeys.length; jci++) {
            var jcIdx = parseInt(jcKeys[jci], 10);
            if (exported.journeys && exported.journeys[jcIdx]) {
              exported.journeys[jcIdx]._comments = this.edits.journeyComments[jcKeys[jci]];
            }
          }

          // Apply feature comments to export
          var fcKeys = Object.keys(this.edits.featureComments);
          for (var fci = 0; fci < fcKeys.length; fci++) {
            var fcKey = fcKeys[fci];
            var fcParts = fcKey.split('--');
            var fcPageId = fcParts[0];
            var fcFeatId = fcParts[1];
            var fcPage = exported.pages.find(function(p) { return p.id === fcPageId; });
            if (fcPage && fcPage.features) {
              var fcFeat = fcPage.features.find(function(f) { return f.id === fcFeatId; });
              if (fcFeat) {
                fcFeat._comments = this.edits.featureComments[fcKey];
              }
            }
          }

          // Apply annotations (page-level and feature-level)
          var annotKeys = Object.keys(this.edits.annotations);

            var ak = annotKeys[ai];
            var av = this.edits.annotations[ak];
            if (ak.indexOf('pageAnnot_') === 0) {
              // Format: pageAnnot_{pageId}_{annotKey}
              var paParts = ak.replace('pageAnnot_', '').split('_');
              var paPageId = paParts[0];
              var paAnnotKey = paParts.slice(1).join('_');
              var paPage = exported.pages.find(function(p) { return p.id === paPageId; });
              if (paPage) {
                if (!paPage.annotations) paPage.annotations = {};
                paPage.annotations[paAnnotKey] = av;
              }
            } else if (ak.indexOf('featAnnot_') === 0) {
              // Format: featAnnot_{pageId}_{featureId}_{annotKey}
              var faParts = ak.replace('featAnnot_', '').split('_');
              var faPageId = faParts[0];
              var faFeatId = faParts[1];
              var faAnnotKey = faParts.slice(2).join('_');
              var faPage = exported.pages.find(function(p) { return p.id === faPageId; });
              if (faPage && faPage.features) {
                var faFeat = faPage.features.find(function(f) { return f.id === faFeatId; });
                if (faFeat) {
                  if (!faFeat.annotations) faFeat.annotations = {};
                  faFeat.annotations[faAnnotKey] = av;
                }
              }
            }
          }

          // Apply feature CRUD operations to exported data
          for (var epi = 0; epi < exported.pages.length; epi++) {
            var expPage = exported.pages[epi];
            if (!expPage.features) expPage.features = [];

            // Remove deleted features
            var delFeats = this.edits.deletedFeatures[expPage.id];
            if (delFeats) {
              expPage.features = expPage.features.filter(function(f) {
                return !delFeats[f.id];
              });
            }

            // Append new features
            var newFeats = this.edits.newFeatures[expPage.id];
            if (newFeats && newFeats.length > 0) {
              expPage.features = expPage.features.concat(newFeats);

            // Apply feature order
            var fOrder = this.edits.featureOrder[expPage.id];

              for (var foi = 0; foi < fOrder.length; foi++) {
                fOrderMap[fOrder[foi]] = foi;

              expPage.features.sort(function(a, b) {

          // Convert screenshot blobs to base64 (IndexedDB path first, then memory fallback)
          var idbKeys = Object.keys(this.edits.screenshotKeys);
          for (var ik = 0; ik < idbKeys.length; ik++) {
            var idbKey = idbKeys[ik];
            if (!this.edits.screenshotKeys[idbKey]) continue;
            try {
              var idbBlob = null;
              if (this.idbAvailable) {
                idbBlob = await ScreenshotDB.load(idbKey);
              }
              if (!idbBlob) continue;

              var idbDataUrl = await blobUrlToDataUrl(idbBlobUrl);
              URL.revokeObjectURL(idbBlobUrl);

              if (idbKey.indexOf('feat__') === 0) {
                // Process feature screenshot: merge base64 into exported features
                var featParts = idbKey.replace('feat__', '').split('__');
                var featPageId = featParts[0];
                var featId = featParts[1];
                var featPage = exported.pages.find(function(p) { return p.id === featPageId; });
                if (featPage && featPage.features) {
                  var exportFeat = featPage.features.find(function(f) { return f.id === featId; });
                  if (exportFeat) {
                    exportFeat.screenshot = idbDataUrl;
                  }
                }
                continue;
              }
              var idbParts = idbKey.split('__');
              var idbPageId = idbParts[0];
              var idbStateName = idbParts[1];
              var idbPage = exported.pages.find(function(p) { return p.id === idbPageId; });
              if (!idbPage) continue;
              if (!idbStateName || idbStateName === 'default') {
                idbPage.screenshot = idbDataUrl;
              } else {
                var idbState = idbPage.states
                  ? idbPage.states.find(function(s) { return s.name === idbStateName; })
                  : null;
                if (idbState) idbState.screenshot = idbDataUrl;
              }
            } catch (e) { /* skip failed conversions */ }
          }

          // Handle in-memory-only screenshots (IDB unavailable fallback path)
          var ssPageIds = Object.keys(this.edits.screenshots);
          for (var spi = 0; spi < ssPageIds.length; spi++) {
            var ssPage = exported.pages.find(function(p) { return p.id === ssPageIds[spi]; });
            if (!ssPage) continue;
            var ssStates = this.edits.screenshots[ssPageIds[spi]];
            var ssStateKeys = Object.keys(ssStates);
            for (var ssi = 0; ssi < ssStateKeys.length; ssi++) {
              // Skip if already handled via IDB
              var memIdbKey = ssPageIds[spi] + '__' + ssStateKeys[ssi];
              if (this.edits.screenshotKeys[memIdbKey]) continue;
              try {
                var memDataUrl = await blobUrlToDataUrl(ssStates[ssStateKeys[ssi]]);
                if (ssStateKeys[ssi] === 'default') {
