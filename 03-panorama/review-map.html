  <script>
    document.addEventListener('alpine:init', function() {

      // ===== ZONE 7: Global Store =====
      Alpine.store('review', {
        // --- Core state ---
        data: null,
        view: 'detail',
        editMode: false,
        selectedPageId: null,
        idbAvailable: false,
        toastMessage: '',
        toastShown: {},
        lightboxSrc: '',
        lightboxOpen: false,
        _key: '',
        _toastTimer: null,
        darkMode: document.documentElement.classList.contains('dark'),
        _pasteTarget: null,

        toggleDarkMode() {
          this.darkMode = !this.darkMode;
          if (this.darkMode) {
            document.documentElement.classList.add('dark');
            localStorage.setItem('review-map-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            localStorage.setItem('review-map-theme', 'light');
          }
        },

        handleGlobalKeydown(event) {
          if (event.isComposing) return;
          if (event.target.matches('input, select, textarea, [contenteditable]')) return;
          if (event.ctrlKey || event.metaKey || event.altKey) return;
          var key = event.key;
          if (key === 'Escape') {
            if (this.lightboxOpen) { this.closeLightbox(); }
            else if (this.editMode) { this.editMode = false; }
            event.preventDefault();
          } else if (key === 'e' || key === 'E') {
            this.editMode = !this.editMode;
            event.preventDefault();
          } else if (key === 'd' || key === 'D') {
            this.toggleDarkMode();
            event.preventDefault();
          } else if (key === '1') {
            this.view = 'flow';
            event.preventDefault();
          } else if (key === '2') {
            this.view = 'detail';
            event.preventDefault();
          } else if (key === '3') {
            this.view = 'journey';
            event.preventDefault();
          }
        },

        // --- Edits overlay (all v2.1 sub-keys initialized) ---
        edits: {
          screenshots: {},
          screenshotKeys: {},
          pageSummaries: {},
          features: {},
          featureScreenshots: {},
          newFeatures: {},
          deletedFeatures: {},
          featureOrder: {},
          featureComments: {},
          connectionLabels: {},
          connectionTypes: {},
          newConnections: [],
          deletedConnections: {},
          pageDisplayNames: {},
          journeys: {},
          journeyComments: {},
          comments: {},
          annotations: {},
        },

        // --- Store init (called automatically by Alpine) ---
        init() {
          try {
            var raw = document.getElementById('map-data').textContent;
            this.data = JSON.parse(raw);
          } catch (e) {
            this.data = { metadata: { projectName: 'unknown' }, pages: [], connections: [], journeys: [] };
          }
          this._key = 'reviewMapEdits_' + (this.data.metadata.projectName || 'default');
          this._loadEdits();
          this._detectStorage();
          this._registerPasteListener();
        },

        // --- Clipboard paste support for screenshot replacement ---
        setPasteTarget(type, id1, id2) {
          this._pasteTarget = { type: type, id1: id1, id2: id2 || null };
        },
        clearPasteTarget() {
          this._pasteTarget = null;
        },
        _registerPasteListener() {
          var self = this;
          document.addEventListener('paste', function(event) {
            if (!self.editMode || !self._pasteTarget) return;
            var items = event.clipboardData && event.clipboardData.items;
            if (!items) return;
            var imageFile = null;
            for (var i = 0; i < items.length; i++) {
              if (items[i].type.indexOf('image/') === 0) {
                imageFile = items[i].getAsFile();
                break;
              }
            }
            if (!imageFile) return;
            event.preventDefault();
            var target = self._pasteTarget;
            if (target.type === 'page') {
              self._saveScreenshotBlob(imageFile, target.id1, target.id2 || 'default');
            } else if (target.type === 'feature') {
              self._saveFeatureScreenshot(imageFile, target.id1, target.id2);
            }
            self.showToast('\u2705 \u5DF2\u7C98\u8D34\u622A\u56FE');
          });
        },

        // --- Load edits from localStorage, merge with defaults ---
        _loadEdits() {
          try {
            var saved = JSON.parse(localStorage.getItem(this._key) || '{}');
            this.edits = {
              screenshots: {},
              screenshotKeys: saved.screenshotKeys || {},
              pageSummaries: saved.pageSummaries || {},
              features: saved.features || {},
              featureScreenshots: {},
              newFeatures: saved.newFeatures || {},
              deletedFeatures: saved.deletedFeatures || {},
              featureOrder: saved.featureOrder || {},
              featureComments: saved.featureComments || {},
              connectionLabels: saved.connectionLabels || {},
              connectionTypes: saved.connectionTypes || {},
              newConnections: saved.newConnections || [],
              deletedConnections: saved.deletedConnections || {},
              pageDisplayNames: saved.pageDisplayNames || {},
              journeys: saved.journeys || {},
              journeyComments: saved.journeyComments || {},
              comments: saved.comments || {},
              annotations: saved.annotations || {},
            };
          } catch (e) {
            /* ignore corrupt data */
          }
        },

        // --- Detect IndexedDB availability and restore persisted screenshots ---
        async _detectStorage() {
          this.idbAvailable = await ScreenshotDB.isAvailable();
          if (this.idbAvailable) {
            await this._restoreScreenshots();
          }
        },

        // --- Restore screenshots from IndexedDB on page load ---
        async _restoreScreenshots() {
          try {
            var keys = await ScreenshotDB.getAllKeys();
            for (var i = 0; i < keys.length; i++) {
              var key = keys[i];
              var blob = await ScreenshotDB.load(key);
              if (!blob) continue;
              var blobUrl = URL.createObjectURL(blob);
              // Key format: pageId__stateName (page) or feat__pageId__featureId (feature)
              if (typeof key === 'string' && key.indexOf('feat__') === 0) {
                var featureKey = key.replace('feat__', '');
                var fss = Object.assign({}, this.edits.featureScreenshots);
                fss[featureKey] = blobUrl;
                var fsk = Object.assign({}, this.edits.screenshotKeys);
                fsk[key] = true;
                this.edits = Object.assign({}, this.edits, {
                  featureScreenshots: fss,
                  screenshotKeys: fsk,
                });
              } else {
                var parts = String(key).split('__');
                var pageId = parts[0];
                var stateName = parts[1] || 'default';
                var pss = Object.assign({}, this.edits.screenshots);
                var pageStates = Object.assign({}, pss[pageId] || {});
                pageStates[stateName] = blobUrl;
                pss[pageId] = pageStates;
                var psk = Object.assign({}, this.edits.screenshotKeys);
                psk[key] = true;
                this.edits = Object.assign({}, this.edits, {
                  screenshots: pss,
                  screenshotKeys: psk,
                });
              }
            }
          } catch (e) { /* silent */ }
        },

        // --- Save a screenshot file: update UI + persist to IndexedDB ---
        async _saveScreenshotBlob(file, pageId, stateName) {
          var blobUrl = URL.createObjectURL(file);
          var key = stateName || 'default';
          var idbKey = pageId + '__' + key;

          // Update UI immediately (immutable)
          var ss = Object.assign({}, this.edits.screenshots);
          var pageStates = Object.assign({}, ss[pageId] || {});
          pageStates[key] = blobUrl;
          ss[pageId] = pageStates;
          this.edits = Object.assign({}, this.edits, { screenshots: ss });

          // Persist to IndexedDB if available
          if (this.idbAvailable) {
            try {
              await ScreenshotDB.save(idbKey, file);
              var sk = Object.assign({}, this.edits.screenshotKeys);
              sk[idbKey] = true;
              this.edits = Object.assign({}, this.edits, { screenshotKeys: sk });
            } catch (e) { /* silent fallback to memory-only */ }
          } else {
            this.showToast('\u5F53\u524D\u6A21\u5F0F\u4E0B\u622A\u56FE\u66FF\u6362\u4EC5\u672C\u6B21\u4F1A\u8BDD\u6709\u6548', 'idb-unavailable');
          }
          this.persistEdits();
        },

        // --- Feature screenshot save (EDIT-DETAIL-05 / CAPTURE-03) ---
        async _saveFeatureScreenshot(file, pageId, featureId) {
          var blobUrl = URL.createObjectURL(file);
          var compositeKey = pageId + '__' + featureId;
          var idbKey = 'feat__' + compositeKey;

          // Update UI immediately (immutable)
          var fss = Object.assign({}, this.edits.featureScreenshots);
          fss[compositeKey] = blobUrl;
          this.edits = Object.assign({}, this.edits, { featureScreenshots: fss });

          // Persist to IndexedDB if available
          if (this.idbAvailable) {
            try {
              await ScreenshotDB.save(idbKey, file);
              var sk = Object.assign({}, this.edits.screenshotKeys);
              sk[idbKey] = true;
              this.edits = Object.assign({}, this.edits, { screenshotKeys: sk });
            } catch (e) { /* silent fallback to memory-only */ }
          } else {
            this.showToast('\u5F53\u524D\u6A21\u5F0F\u4E0B\u622A\u56FE\u66FF\u6362\u4EC5\u672C\u6B21\u4F1A\u8BDD\u6709\u6548', 'idb-unavailable');
          }
          this.persistEdits();
        },

        // --- Screenshot upload handler (file input) ---
        async handleScreenshotUpload(event, pageId, stateName) {
          var file = event.target && event.target.files ? event.target.files[0] : null;
          if (!file || file.type.indexOf('image/') !== 0) return;
          await this._saveScreenshotBlob(file, pageId, stateName);
          event.target.value = '';
        },

        // --- Screenshot drop handler (drag and drop) ---
        async handleScreenshotDrop(event, pageId, stateName) {
          event.preventDefault();
          var file = event.dataTransfer && event.dataTransfer.files ? event.dataTransfer.files[0] : null;
          if (!file || file.type.indexOf('image/') !== 0) return;
          await this._saveScreenshotBlob(file, pageId, stateName);
        },

        // --- CRITICAL: Immutable update for edits (Alpine Proxy reactivity) ---
        updateEdit(category, key, value) {
          if (Array.isArray(this.edits[category])) {
            var updated = [].concat(this.edits[category]);
            updated.push(value);
            this.edits = Object.assign({}, this.edits, (function() {
              var o = {}; o[category] = updated; return o;
            })());
          } else {
            var catCopy = Object.assign({}, this.edits[category] || {});
            catCopy[key] = value;
            this.edits = Object.assign({}, this.edits, (function() {
              var o = {}; o[category] = catCopy; return o;
            })());
          }
          this.persistEdits();
        },

        // --- Persist edits to localStorage (exclude Blob URL categories) ---
        persistEdits() {
          try {
            var toSave = Object.assign({}, this.edits);
            delete toSave.screenshots;
            delete toSave.featureScreenshots;
            localStorage.setItem(this._key, JSON.stringify(toSave));
          } catch (e) {
            /* localStorage full */
          }
        },

        // --- Computed: total edit count ---
        get editCount() {
          var count = 0;
          var edits = this.edits;
          var keys = Object.keys(edits);
          for (var i = 0; i < keys.length; i++) {
            var cat = edits[keys[i]];
            if (Array.isArray(cat)) {
              count += cat.length;
            } else if (cat && typeof cat === 'object') {
              count += Object.keys(cat).length;
            }
          }
          return count;
        },

        // --- Computed: has any edits ---
        get hasEdits() {
          return this.editCount > 0;
        },

        // --- Overlay accessors ---

        getFeature(pageId, featureId, field) {
          var editKey = pageId + '_' + featureId;
          var edited = this.edits.features[editKey];
          if (edited && edited[field] !== undefined) return edited[field];
          if (!this.data) return '';
          var page = this.data.pages.find(function(p) { return p.id === pageId; });
          var feature = page && page.features
            ? page.features.find(function(f) { return f.id === featureId; })
            : null;
          return feature ? (feature[field] || '') : '';
        },

        getPageSummary(pageId) {
          if (this.edits.pageSummaries[pageId] !== undefined) {
            return this.edits.pageSummaries[pageId];
          }
          if (!this.data) return '';
          var page = this.data.pages.find(function(p) { return p.id === pageId; });
          return page ? (page.summary || '') : '';
        },

        // --- v2.1 Annotation accessors ---

        getPageAnnotation(pageId, annotKey) {
          var editKey = 'pageAnnot_' + pageId + '_' + annotKey;
          if (this.edits.annotations && this.edits.annotations[editKey] !== undefined) {
            return this.edits.annotations[editKey];
          }
          if (!this.data) return '';
          var page = this.data.pages.find(function(p) { return p.id === pageId; });
          return (page && page.annotations && page.annotations[annotKey]) || '';
        },

        getFeatureAnnotation(pageId, featureId, annotKey) {
          var editKey = 'featAnnot_' + pageId + '_' + featureId + '_' + annotKey;
          if (this.edits.annotations && this.edits.annotations[editKey] !== undefined) {
            return this.edits.annotations[editKey];
          }
          if (!this.data) return '';
          var page = this.data.pages.find(function(p) { return p.id === pageId; });
          var feature = page && page.features
            ? page.features.find(function(f) { return f.id === featureId; })
            : null;
          return (feature && feature.annotations && feature.annotations[annotKey]) || '';
        },

        hasAnyPageAnnotation(pageId) {
          var self = this;
          return ANNOTATION_BLOCKS.some(function(block) {
            return !!self.getPageAnnotation(pageId, block.key);
          });
        },

        hasAnyFeatureAnnotation(pageId, featureId) {
          var self = this;
          return ANNOTATION_BLOCKS.some(function(block) {
            return !!self.getFeatureAnnotation(pageId, featureId, block.key);
          });
        },

        getScreenshotSrc(pageId, stateName) {
          var key = stateName || 'default';
          var override = this.edits.screenshots[pageId];
          if (override && override[key]) return override[key];
          if (!this.data) return '';
          var page = this.data.pages.find(function(p) { return p.id === pageId; });
          if (!page) return '';
          if (key === 'default') return 'screenshots/' + page.screenshot;
          var state = page.states
            ? page.states.find(function(s) { return s.name === key; })
            : null;
          return state ? 'screenshots/' + state.screenshot : 'screenshots/' + page.screenshot;
        },

        getConnectionLabel(connId) {
          if (this.edits.connectionLabels[connId] !== undefined) {
            return this.edits.connectionLabels[connId];
          }
          if (!this.data) return '';
          var conn = this.data.connections.find(function(c) { return c.id === connId; });
          return conn ? (conn.label || '') : '';
        },

        getConnectionType(connId) {
          if (this.edits.connectionTypes[connId] !== undefined) {
            return this.edits.connectionTypes[connId];
          }
          if (!this.data) return 'navigation';
          var conn = this.data.connections.find(function(c) { return c.id === connId; });
          return conn ? (conn.type || 'navigation') : 'navigation';
        },

        getComments(pageId) {
          return this.edits.comments[pageId] || [];
        },

        getCommentCount(pageId) {
          return (this.edits.comments[pageId] || []).length;
        },

        // --- Lightbox controls ---

        openLightbox(src) {
          this.lightboxSrc = src;
          this.lightboxOpen = true;
        },

        closeLightbox() {
          this.lightboxOpen = false;
          this.lightboxSrc = '';
        },

        // --- Feature screenshot accessor ---

        getFeatureScreenshotSrc(pageId, featureId) {
          var compositeKey = pageId + '__' + featureId;
          if (this.edits.featureScreenshots[compositeKey]) {
            return this.edits.featureScreenshots[compositeKey];
          }
          if (!this.data) return '';
          var page = this.data.pages.find(function(p) { return p.id === pageId; });
          var feat = page && page.features
            ? page.features.find(function(f) { return f.id === featureId; })
            : null;
          return feat && feat.screenshot ? 'screenshots/' + feat.screenshot : '';
        },

        // --- Journey step screenshot accessor ---
        // Priority: step.screenshot > step.featureId match > page default screenshot
        getStepScreenshotSrc(step) {
          if (!step) return '';
          // 1. Step-level explicit screenshot
          if (step.screenshot) return 'screenshots/' + step.screenshot;
          // 2. If step has a featureId, use the feature screenshot
          if (step.featureId && step.pageId) {
            var featSrc = this.getFeatureScreenshotSrc(step.pageId, step.featureId);
            if (featSrc) return featSrc;
          }
          // 3. Fallback to page default screenshot
          if (step.pageId) return this.getScreenshotSrc(step.pageId, 'default');
          return '';
        },

        // --- Feature comment count accessor ---

        getFeatureCommentCount(pageId, featureId) {
          var key = pageId + '--' + featureId;
          return (this.edits.featureComments[key] || []).length;
        },

        getFeatureComments(pageId, featureId) {
          var key = pageId + '--' + featureId;
          return this.edits.featureComments[key] || [];
        },

        addFeatureComment(pageId, featureId, text) {
          if (!text || !text.trim()) return;
          var author = localStorage.getItem('reviewMapAuthor') || '';
          var now = new Date();
          var yyyy = now.getFullYear();
          var mm = (now.getMonth() + 1 < 10 ? '0' : '') + (now.getMonth() + 1);
          var dd = (now.getDate() < 10 ? '0' : '') + now.getDate();
          var hh = (now.getHours() < 10 ? '0' : '') + now.getHours();
          var mi = (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
          var timestamp = yyyy + '-' + mm + '-' + dd + ' ' + hh + ':' + mi;
          var comment = { id: generateId(), text: text.trim(), author: author, timestamp: timestamp };
          var key = pageId + '--' + featureId;
          var existing = (this.edits.featureComments[key] || []).slice();
          existing.push(comment);
          var fc = Object.assign({}, this.edits.featureComments);
          fc[key] = existing;
          this.edits = Object.assign({}, this.edits, { featureComments: fc });
          this.persistEdits();
        },

        setReviewAuthor(name) {
          localStorage.setItem('reviewMapAuthor', name || '');
        },

        getJourneyCommentCount(journeyIdx) {
          return (this.edits.journeyComments[journeyIdx] || []).length;
        },

        getJourneyComments(journeyIdx) {
          return this.edits.journeyComments[journeyIdx] || [];
        },

        addJourneyComment(journeyIdx, text) {
          var now = new Date();
          var ts = now.getFullYear() + '-' +
            String(now.getMonth() + 1).padStart(2, '0') + '-' +
            String(now.getDate()).padStart(2, '0') + ' ' +
            String(now.getHours()).padStart(2, '0') + ':' +
            String(now.getMinutes()).padStart(2, '0');
          var author = localStorage.getItem('reviewMapAuthor') || '匿名';
          var comment = { id: Date.now(), author: author, text: text.trim(), timestamp: ts };
          var existing = (this.edits.journeyComments[journeyIdx] || []).slice();
          existing.push(comment);
          var jc = Object.assign({}, this.edits.journeyComments);
          jc[journeyIdx] = existing;
          this.edits = Object.assign({}, this.edits, { journeyComments: jc });
          this.persistEdits();
        },

        // --- Utility accessors ---

        connColor(type) {
          var colors = {
            navigation: '#3B82F6',
            redirect: '#8B5CF6',
            back: '#9CA3AF',
            conditional: '#F59E0B',
            data: '#10B981'
          };
          return colors[type] || '#6B7280';
        },

        connectionBadgeClass(type) {
          var classes = {
            navigation: 'bg-blue-100 text-blue-700',
            redirect: 'bg-purple-100 text-purple-700',
            back: 'bg-gray-100 text-gray-500',
            conditional: 'bg-amber-100 text-amber-700',
            data: 'bg-green-100 text-green-700',
          };
          return classes[type] || 'bg-gray-100 text-gray-600';
        },

        // --- Toast notification ---

        showToast(message, key) {
          if (key && this.toastShown[key]) return;
          if (key) {
            this.toastShown = Object.assign({}, this.toastShown, (function() {
              var o = {}; o[key] = true; return o;
            })());
          }
          var self = this;
          self.toastMessage = message;
          if (self._toastTimer) clearTimeout(self._toastTimer);
          self._toastTimer = setTimeout(function() {
            self.toastMessage = '';
            self._toastTimer = null;
          }, 4000);
        },

        // --- Reset all edits ---

        resetEdits() {
          var count = this.editCount;
          if (count === 0) return;
          if (!confirm('确定要重置所有修改吗？将清除 ' + count + ' 项编辑内容。')) return;

          // Revoke all screenshot Blob URLs
          var screenshots = this.edits.screenshots;
          var ssKeys = Object.keys(screenshots);
          for (var i = 0; i < ssKeys.length; i++) {
            var states = screenshots[ssKeys[i]];
            var stateKeys = Object.keys(states);
            for (var j = 0; j < stateKeys.length; j++) {
              try { URL.revokeObjectURL(states[stateKeys[j]]); } catch (e) { /* noop */ }
            }
          }
          var featureScreenshots = this.edits.featureScreenshots;
          var fsKeys = Object.keys(featureScreenshots);
          for (var k = 0; k < fsKeys.length; k++) {
            try { URL.revokeObjectURL(featureScreenshots[fsKeys[k]]); } catch (e) { /* noop */ }
          }

          // Clear IndexedDB if available
          if (this.idbAvailable) {
            ScreenshotDB.clear().catch(function() { /* noop */ });
          }

          // Reset edits to defaults
          this.edits = {
            screenshots: {},
            screenshotKeys: {},
            pageSummaries: {},
            features: {},
            featureScreenshots: {},
            newFeatures: {},
            deletedFeatures: {},
            featureOrder: {},
            featureComments: {},
            connectionLabels: {},
            connectionTypes: {},
            newConnections: [],
            deletedConnections: {},
            pageDisplayNames: {},
            journeys: {},
            journeyComments: {},
            comments: {},
            annotations: {},
          };
          localStorage.removeItem(this._key);
        },

        // --- Export data as JSON ---

        async exportData() {
          if (!this.data) return;
          var exported = JSON.parse(JSON.stringify(this.data));

          // Apply page summaries
          var summaryKeys = Object.keys(this.edits.pageSummaries);
          for (var si = 0; si < summaryKeys.length; si++) {
            var pageId = summaryKeys[si];
            var page = exported.pages.find(function(p) { return p.id === pageId; });
            if (page) page.summary = this.edits.pageSummaries[pageId];
          }

          // Apply feature edits
          var featureKeys = Object.keys(this.edits.features);
          for (var fi = 0; fi < featureKeys.length; fi++) {
            var parts = featureKeys[fi].split('_');
            var fPageId = parts[0];
            var fFeatureId = parts.slice(1).join('_');
            var fPage = exported.pages.find(function(p) { return p.id === fPageId; });
            if (fPage && fPage.features) {
              var feat = fPage.features.find(function(f) { return f.id === fFeatureId; });
              if (feat) {
                Object.assign(feat, this.edits.features[featureKeys[fi]]);
              }
            }
          }

          // Apply page display names
          var nameKeys = Object.keys(this.edits.pageDisplayNames);
          for (var ni = 0; ni < nameKeys.length; ni++) {
            var nPage = exported.pages.find(function(p) { return p.id === nameKeys[ni]; });
            if (nPage) nPage.name = this.edits.pageDisplayNames[nameKeys[ni]];
          }

          // Apply connection edits
          var connLabelKeys = Object.keys(this.edits.connectionLabels);
          for (var cli = 0; cli < connLabelKeys.length; cli++) {
            var conn = exported.connections.find(function(c) { return c.id === connLabelKeys[cli]; });
            if (conn) conn.label = this.edits.connectionLabels[connLabelKeys[cli]];
          }
          var connTypeKeys = Object.keys(this.edits.connectionTypes);
          for (var cti = 0; cti < connTypeKeys.length; cti++) {
            var conn2 = exported.connections.find(function(c) { return c.id === connTypeKeys[cti]; });
            if (conn2) conn2.type = this.edits.connectionTypes[connTypeKeys[cti]];
          }

          // Apply deleted connections
          var delConnKeys = Object.keys(this.edits.deletedConnections);
          exported.connections = exported.connections.filter(function(c) {
            return !delConnKeys.includes(c.id);
          });

          // Append new connections
          if (this.edits.newConnections.length > 0) {
            exported.connections = exported.connections.concat(this.edits.newConnections);
          }

          // Apply journey edits (enhanced)
          if (exported.journeys) {
            var journeyKeys = Object.keys(this.edits.journeys);
            // First pass: update existing journeys
            for (var ji = 0; ji < journeyKeys.length; ji++) {
              var jk = journeyKeys[ji];
              var jEdits = this.edits.journeys[jk];
              var jIdx = parseInt(jk, 10);
              if (jEdits._deleted || jEdits._isNew) continue;
              if (exported.journeys[jIdx]) {
                if (jEdits.name !== undefined) exported.journeys[jIdx].name = jEdits.name;
                if (jEdits.goal !== undefined) exported.journeys[jIdx].goal = jEdits.goal;
                if (jEdits.steps) exported.journeys[jIdx].steps = jEdits.steps;
              }
            }
            // Second pass: append new journeys
            for (var ji2 = 0; ji2 < journeyKeys.length; ji2++) {
              var jk2 = journeyKeys[ji2];
              var jEdits2 = this.edits.journeys[jk2];
              if (jEdits2._isNew) {
                var nj = { name: jEdits2.name || '', goal: jEdits2.goal || '', steps: jEdits2.steps || [] };
                exported.journeys.push(nj);
              }
            }
            // Third pass: filter deleted journeys (reverse to preserve indices)
            for (var ji3 = exported.journeys.length - 1; ji3 >= 0; ji3--) {
              var jEdits3 = this.edits.journeys[String(ji3)];
              if (jEdits3 && jEdits3._deleted) {
                exported.journeys.splice(ji3, 1);
              }
            }
          }

          // Apply journey comments to export
          var jcKeys = Object.keys(this.edits.journeyComments);
          for (var jci = 0; jci < jcKeys.length; jci++) {
            var jcIdx = parseInt(jcKeys[jci], 10);
            if (exported.journeys && exported.journeys[jcIdx]) {
              exported.journeys[jcIdx]._comments = this.edits.journeyComments[jcKeys[jci]];
            }
          }

          // Apply feature comments to export
          var fcKeys = Object.keys(this.edits.featureComments);
          for (var fci = 0; fci < fcKeys.length; fci++) {
            var fcKey = fcKeys[fci];
            var fcParts = fcKey.split('--');
            var fcPageId = fcParts[0];
            var fcFeatId = fcParts[1];
            var fcPage = exported.pages.find(function(p) { return p.id === fcPageId; });
            if (fcPage && fcPage.features) {
              var fcFeat = fcPage.features.find(function(f) { return f.id === fcFeatId; });
              if (fcFeat) {
                fcFeat._comments = this.edits.featureComments[fcKey];
              }
            }
          }

          // Apply feature CRUD operations to exported data
          for (var epi = 0; epi < exported.pages.length; epi++) {
            var expPage = exported.pages[epi];
            if (!expPage.features) expPage.features = [];

            // Remove deleted features
            var delFeats = this.edits.deletedFeatures[expPage.id];
            if (delFeats) {
              expPage.features = expPage.features.filter(function(f) {
                return !delFeats[f.id];
              });
            }

            // Append new features
            var newFeats = this.edits.newFeatures[expPage.id];
            if (newFeats && newFeats.length > 0) {
              expPage.features = expPage.features.concat(newFeats);
            }

            // Apply feature order
            var fOrder = this.edits.featureOrder[expPage.id];
            if (fOrder && fOrder.length > 0) {
              var fOrderMap = {};
              for (var foi = 0; foi < fOrder.length; foi++) {
                fOrderMap[fOrder[foi]] = foi;
              }
              expPage.features.sort(function(a, b) {
                var ai = fOrderMap[a.id] !== undefined ? fOrderMap[a.id] : 9999;
                var bi = fOrderMap[b.id] !== undefined ? fOrderMap[b.id] : 9999;
                return ai - bi;
              });
            }
          }

          // Convert screenshot blobs to base64 (IndexedDB path first, then memory fallback)
          var idbKeys = Object.keys(this.edits.screenshotKeys);
          for (var ik = 0; ik < idbKeys.length; ik++) {
            var idbKey = idbKeys[ik];
            if (!this.edits.screenshotKeys[idbKey]) continue;
            try {
              var idbBlob = null;
              if (this.idbAvailable) {
                idbBlob = await ScreenshotDB.load(idbKey);
              }
              if (!idbBlob) continue;
              var idbBlobUrl = URL.createObjectURL(idbBlob);
              var idbDataUrl = await blobUrlToDataUrl(idbBlobUrl);
              URL.revokeObjectURL(idbBlobUrl);
              // Parse key to find target
              if (idbKey.indexOf('feat__') === 0) {
                // Process feature screenshot: merge base64 into exported features
                var featParts = idbKey.replace('feat__', '').split('__');
                var featPageId = featParts[0];
                var featId = featParts[1];
                var featPage = exported.pages.find(function(p) { return p.id === featPageId; });
                if (featPage && featPage.features) {
                  var exportFeat = featPage.features.find(function(f) { return f.id === featId; });
                  if (exportFeat) {
                    exportFeat.screenshot = idbDataUrl;
                  }
                }
                continue;
              }
              var idbParts = idbKey.split('__');
              var idbPageId = idbParts[0];
              var idbStateName = idbParts[1];
              var idbPage = exported.pages.find(function(p) { return p.id === idbPageId; });
              if (!idbPage) continue;
              if (!idbStateName || idbStateName === 'default') {
                idbPage.screenshot = idbDataUrl;
              } else {
                var idbState = idbPage.states
                  ? idbPage.states.find(function(s) { return s.name === idbStateName; })
                  : null;
                if (idbState) idbState.screenshot = idbDataUrl;
              }
            } catch (e) { /* skip failed conversions */ }
          }

          // Handle in-memory-only screenshots (IDB unavailable fallback path)
          var ssPageIds = Object.keys(this.edits.screenshots);
          for (var spi = 0; spi < ssPageIds.length; spi++) {
            var ssPage = exported.pages.find(function(p) { return p.id === ssPageIds[spi]; });
            if (!ssPage) continue;
            var ssStates = this.edits.screenshots[ssPageIds[spi]];
            var ssStateKeys = Object.keys(ssStates);
            for (var ssi = 0; ssi < ssStateKeys.length; ssi++) {
              // Skip if already handled via IDB
              var memIdbKey = ssPageIds[spi] + '__' + ssStateKeys[ssi];
              if (this.edits.screenshotKeys[memIdbKey]) continue;
              try {
                var memDataUrl = await blobUrlToDataUrl(ssStates[ssStateKeys[ssi]]);
                if (ssStateKeys[ssi] === 'default') {
                  ssPage.screenshot = memDataUrl;
                } else {
                  var memState = ssPage.states
                    ? ssPage.states.find(function(s) { return s.name === ssStateKeys[ssi]; })
                    : null;
                  if (memState) memState.screenshot = memDataUrl;
                }
              } catch (e) { /* skip failed conversions */ }
            }
          }

          // Add comments
          if (Object.keys(this.edits.comments).length > 0) {
            exported.reviewComments = this.edits.comments;
          }

          // Update metadata
          exported.metadata.version = '2.0';
          exported.metadata.lastEditedAt = new Date().toISOString();

          // Download
          var json = JSON.stringify(exported, null, 2);
          var blob = new Blob([json], { type: 'application/json' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = 'review-map-data-' + Date.now() + '.json';
          a.click();
          URL.revokeObjectURL(url);
        },
      });

      // ===== ZONE 8: View Components =====

      // ===== Sugiyama Layout Utility =====
      function sugiyamaLayout(nodes, edges, options) {
        var opts = Object.assign({
          nodeWidth: 160, nodeHeight: 90,
          layerGap: 220, nodeGap: 120,
          marginX: 40, marginY: 40,
          componentGap: 80
        }, options || {});

        if (!nodes || nodes.length === 0) {
          return { positions: {}, width: 0, height: 0, reversedEdges: {} };
        }

        var nodeIds = [];
        var nodeSet = {};
        for (var i = 0; i < nodes.length; i++) {
          nodeIds.push(nodes[i].id);
          nodeSet[nodes[i].id] = true;
        }

        // Build adjacency lists
        var adjOut = {};
        var adjIn = {};
        for (var i = 0; i < nodeIds.length; i++) {
          adjOut[nodeIds[i]] = [];
          adjIn[nodeIds[i]] = [];
        }
        var validEdges = [];
        for (var i = 0; i < edges.length; i++) {
          var e = edges[i];
          if (nodeSet[e.from] && nodeSet[e.to]) {
            validEdges.push(e);
            adjOut[e.from].push(e.to);
            adjIn[e.to].push(e.from);
          }
        }

        // Step 1: Cycle removal (DFS)
        var reversedEdges = {};
        var visited = {};
        var onStack = {};
        var workAdj = {};
        var workIn = {};
        for (var i = 0; i < nodeIds.length; i++) {
          workAdj[nodeIds[i]] = [];
          workIn[nodeIds[i]] = [];
        }

        function dfs(node) {
          visited[node] = true;
          onStack[node] = true;
          var neighbors = adjOut[node];
          for (var j = 0; j < neighbors.length; j++) {
            var nb = neighbors[j];
            if (onStack[nb]) {
              // Back edge: reverse it
              reversedEdges[node + '->' + nb] = true;
              workAdj[nb].push(node);
              workIn[node].push(nb);
            } else if (!visited[nb]) {
              workAdj[node].push(nb);
              workIn[nb].push(node);
              dfs(nb);
            } else {
              workAdj[node].push(nb);
              workIn[nb].push(node);
            }
          }
          onStack[node] = false;
        }

        for (var i = 0; i < nodeIds.length; i++) {
          if (!visited[nodeIds[i]]) {
            dfs(nodeIds[i]);
          }
        }

        // Step 2: Find connected components via BFS
        var compVisited = {};
        var components = [];
        for (var i = 0; i < nodeIds.length; i++) {
          var start = nodeIds[i];
          if (compVisited[start]) continue;
          var comp = [];
          var queue = [start];
          compVisited[start] = true;
          while (queue.length > 0) {
            var cur = queue.shift();
            comp.push(cur);
            var neighbors = workAdj[cur].concat(workIn[cur]);
            for (var j = 0; j < neighbors.length; j++) {
              if (!compVisited[neighbors[j]]) {
                compVisited[neighbors[j]] = true;
                queue.push(neighbors[j]);
              }
            }
          }
          components.push(comp);
        }

        // Step 2b: Layer assignment (longest path) per component
        var layers = {};
        function assignLayers(compNodes) {
          // Find entry nodes (no incoming in this component)
          var compSet = {};
          for (var i = 0; i < compNodes.length; i++) compSet[compNodes[i]] = true;
          var entries = [];
          for (var i = 0; i < compNodes.length; i++) {
            var n = compNodes[i];
            var hasIn = false;
            for (var j = 0; j < workIn[n].length; j++) {
              if (compSet[workIn[n][j]]) { hasIn = true; break; }
            }
            if (!hasIn) entries.push(n);
          }
          if (entries.length === 0) entries.push(compNodes[0]);

          // BFS longest path
          var dist = {};
          for (var i = 0; i < compNodes.length; i++) dist[compNodes[i]] = -1;
          for (var i = 0; i < entries.length; i++) dist[entries[i]] = 0;

          var changed = true;
          var maxIter = compNodes.length + 1;
          while (changed && maxIter-- > 0) {
            changed = false;
            for (var i = 0; i < compNodes.length; i++) {
              var n = compNodes[i];
              var preds = workIn[n];
              for (var j = 0; j < preds.length; j++) {
                if (compSet[preds[j]] && dist[preds[j]] >= 0) {
                  var newDist = dist[preds[j]] + 1;
                  if (newDist > dist[n]) {
                    dist[n] = newDist;
                    changed = true;
                  }
                }
              }
            }
          }
          // Any unreachable nodes get layer 0
          for (var i = 0; i < compNodes.length; i++) {
            if (dist[compNodes[i]] < 0) dist[compNodes[i]] = 0;
          }
          return dist;
        }

        // Step 3: Crossing minimization (median heuristic)
        function minimizeCrossings(layerNodes, compNodes) {
          // Build layer-to-nodes map
          var maxLayer = 0;
          for (var i = 0; i < compNodes.length; i++) {
            if (layerNodes[compNodes[i]] > maxLayer) maxLayer = layerNodes[compNodes[i]];
          }
          var layerMap = [];
          for (var l = 0; l <= maxLayer; l++) layerMap.push([]);
          for (var i = 0; i < compNodes.length; i++) {
            layerMap[layerNodes[compNodes[i]]].push(compNodes[i]);
          }

          // Assign initial order
          var order = {};
          for (var l = 0; l <= maxLayer; l++) {
            for (var j = 0; j < layerMap[l].length; j++) {
              order[layerMap[l][j]] = j;
            }
          }

          var compSet = {};
          for (var i = 0; i < compNodes.length; i++) compSet[compNodes[i]] = true;

          // 10 iterations of forward + backward sweep
          for (var iter = 0; iter < 10; iter++) {
            // Forward sweep
            for (var l = 1; l <= maxLayer; l++) {
              var medians = [];
              for (var j = 0; j < layerMap[l].length; j++) {
                var n = layerMap[l][j];
                var preds = workIn[n];
                var positions = [];
                for (var k = 0; k < preds.length; k++) {
                  if (compSet[preds[k]] && layerNodes[preds[k]] === l - 1) {
                    positions.push(order[preds[k]]);
                  }
                }
                positions.sort(function(a, b) { return a - b; });
                var med = positions.length > 0 ? positions[Math.floor(positions.length / 2)] : order[n];
                medians.push({ id: n, median: med });
              }
              medians.sort(function(a, b) { return a.median - b.median; });
              layerMap[l] = [];
              for (var j = 0; j < medians.length; j++) {
                layerMap[l].push(medians[j].id);
                order[medians[j].id] = j;
              }
            }
            // Backward sweep
            for (var l = maxLayer - 1; l >= 0; l--) {
              var medians = [];
              for (var j = 0; j < layerMap[l].length; j++) {
                var n = layerMap[l][j];
                var succs = workAdj[n];
                var positions = [];
                for (var k = 0; k < succs.length; k++) {
                  if (compSet[succs[k]] && layerNodes[succs[k]] === l + 1) {
                    positions.push(order[succs[k]]);
                  }
                }
                positions.sort(function(a, b) { return a - b; });
                var med = positions.length > 0 ? positions[Math.floor(positions.length / 2)] : order[n];
                medians.push({ id: n, median: med });
              }
              medians.sort(function(a, b) { return a.median - b.median; });
              layerMap[l] = [];
              for (var j = 0; j < medians.length; j++) {
                layerMap[l].push(medians[j].id);
                order[medians[j].id] = j;
              }
            }
          }

          return { layerMap: layerMap, order: order, maxLayer: maxLayer };
        }

        // Step 4: Coordinate assignment
        var positions = {};
        var totalWidth = 0;
        var totalHeight = 0;
        var yOffset = opts.marginY;

        for (var ci = 0; ci < components.length; ci++) {
          var comp = components[ci];
          var compLayers = assignLayers(comp);
          var result = minimizeCrossings(compLayers, comp);
          var layerMap = result.layerMap;
          var maxLayer = result.maxLayer;

          // Find max nodes in any layer for centering
          var maxNodesInLayer = 0;
          for (var l = 0; l <= maxLayer; l++) {
            if (layerMap[l].length > maxNodesInLayer) maxNodesInLayer = layerMap[l].length;
          }
          var compHeight = maxNodesInLayer * opts.nodeGap;

          for (var l = 0; l <= maxLayer; l++) {
            var layerSize = layerMap[l].length;
            var layerHeight = layerSize * opts.nodeGap;
            var vertOffset = yOffset + (compHeight - layerHeight) / 2;
            for (var j = 0; j < layerMap[l].length; j++) {
              var nid = layerMap[l][j];
              positions[nid] = {
                x: opts.marginX + l * opts.layerGap,
                y: vertOffset + j * opts.nodeGap,
                layer: compLayers[nid],
                order: j
              };
            }
          }

          var compW = opts.marginX + (maxLayer + 1) * opts.layerGap + opts.nodeWidth;
          if (compW > totalWidth) totalWidth = compW;
          yOffset += compHeight + opts.componentGap;
        }

        totalHeight = yOffset - opts.componentGap + opts.marginY + opts.nodeHeight;

        return {
          positions: positions,
          width: totalWidth,
          height: totalHeight,
          reversedEdges: reversedEdges
        };
      }

      Alpine.data('flowView', function() {
        return {
          nodes: [],
          edges: [],
          svgWidth: 0,
          svgHeight: 0,
          viewBox: '0 0 0 0',
          zoom: 1,
          nodeWidth: 160,
          nodeHeight: 90,
          selectedEdge: null,
          editingLabel: null,
          addingConnection: null,
          editingNodeName: null,
          isSmallScreen: false,

          init: function() {
            var self = this;
            self.isSmallScreen = window.matchMedia('(max-width: 767px)').matches;
            var mql = window.matchMedia('(max-width: 767px)');
            var timer = null;
            var handler = function(e) {
              clearTimeout(timer);
              timer = setTimeout(function() {
                self.isSmallScreen = e.matches;
                self.computeLayout();
              }, 150);
            };
            if (mql.addEventListener) { mql.addEventListener('change', handler); }
            self.computeLayout();
            self.$watch('$store.review.data', function() {
              self.computeLayout();
            });
            self.$watch('$store.review.darkMode', function() {
              self.renderGraph();
            });
          },

          computeLayout: function() {
            var store = this.$store.review;
            var pages = (store.data && store.data.pages) ? store.data.pages : [];
            var connections = (store.data && store.data.connections) ? store.data.connections : [];
            if (pages.length === 0) return;

            // Filter deleted connections, add new ones
            var activeConns = [];
            for (var i = 0; i < connections.length; i++) {
              if (!store.edits.deletedConnections[connections[i].id]) {
                activeConns.push(connections[i]);
              }
            }
            var newConns = store.edits.newConnections || [];
            for (var i = 0; i < newConns.length; i++) {
              activeConns.push(newConns[i]);
            }

            // Build layout input
            var layoutNodes = [];
            for (var i = 0; i < pages.length; i++) {
              layoutNodes.push({ id: pages[i].id });
            }
            var layoutEdges = [];
            for (var i = 0; i < activeConns.length; i++) {
              layoutEdges.push({ from: activeConns[i].from, to: activeConns[i].to });
            }

            var layoutResult = sugiyamaLayout(layoutNodes, layoutEdges);

            // Map to nodes with full data
            var pageMap = {};
            for (var i = 0; i < pages.length; i++) {
              pageMap[pages[i].id] = pages[i];
            }

            var newNodes = [];
            for (var i = 0; i < pages.length; i++) {
              var p = pages[i];
              var pos = layoutResult.positions[p.id];
              if (!pos) continue;
              newNodes.push({
                id: p.id,
                x: pos.x,
                y: pos.y,
                name: p.name,
                pageType: p.pageType || 'normal'
              });
            }

            // Compute edge paths and labels
            var self = this;
            var newEdges = [];
            var labelPositions = [];
            for (var i = 0; i < activeConns.length; i++) {
              var conn = activeConns[i];
              var fromPos = layoutResult.positions[conn.from];
              var toPos = layoutResult.positions[conn.to];
              if (!fromPos || !toPos) continue;

              var isReversed = layoutResult.reversedEdges && layoutResult.reversedEdges[conn.from + '->' + conn.to];
              var sx, sy, tx, ty;
              if (isReversed) {
                sx = toPos.x; sy = toPos.y;
                tx = fromPos.x; ty = fromPos.y;
              } else {
                sx = fromPos.x; sy = fromPos.y;
                tx = toPos.x; ty = toPos.y;
              }

              var path = self.edgePath(sx, sy, tx, ty);
              var labelX = (sx + self.nodeWidth + tx) / 2;
              var labelY = (sy + self.nodeHeight / 2 + ty + self.nodeHeight / 2) / 2;

              // Simple label collision detection
              for (var j = 0; j < labelPositions.length; j++) {
                if (Math.abs(labelY - labelPositions[j]) < 16) {
                  labelY = labelPositions[j] + 20;
                }
              }
              labelPositions.push(labelY);

              var label = store.getConnectionLabel ? store.getConnectionLabel(conn.id) : (conn.label || '');
              var type = store.getConnectionType ? store.getConnectionType(conn.id) : (conn.type || 'navigation');

              newEdges.push({
                id: conn.id,
                from: conn.from,
                to: conn.to,
                path: path,
                label: label,
                labelX: labelX,
                labelY: labelY,
                type: type
              });
            }

            this.nodes = newNodes;
            this.edges = newEdges;
            this.svgWidth = layoutResult.width;
            this.svgHeight = layoutResult.height;
            this.updateViewBox();
            this.renderGraph();
          },

          renderGraph: function() {
            var self = this;
            var store = this.$store.review;
            if (!this.$refs.edgesGroup || !this.$refs.nodesGroup) return;
            var isDark = store.darkMode;
            var labelFill = isDark ? '#E5E7EB' : '#6B7280';

            // Dark mode edge color overrides (lighter variants for visibility)
            var darkEdgeColors = {
              navigation: '#60A5FA',
              redirect: '#A78BFA',
              back: '#9CA3AF',
              conditional: '#FBBF24',
              data: '#34D399'
            };

            // Build edges SVG
            var edgesHtml = '';
            for (var i = 0; i < this.edges.length; i++) {
              var edge = this.edges[i];
              var color = isDark ? (darkEdgeColors[edge.type] || store.connColor(edge.type)) : store.connColor(edge.type);
              var dash = edge.type === 'redirect' ? '6 4' : edge.type === 'conditional' ? '4 2' : edge.type === 'data' ? '2 4' : 'none';
              edgesHtml += '<g data-edge-id="' + edge.id + '">';
              edgesHtml += '<path d="' + edge.path + '" fill="none" stroke="transparent" stroke-width="20" style="cursor:pointer"/>';
              edgesHtml += '<path d="' + edge.path + '" fill="none" stroke="' + color + '" stroke-width="2"'
                + (dash !== 'none' ? ' stroke-dasharray="' + dash + '"' : '')
                + ' marker-end="url(#flow-arrowhead)" style="pointer-events:none"/>';
              edgesHtml += '<text x="' + edge.labelX + '" y="' + edge.labelY + '" text-anchor="middle" dominant-baseline="central"'
                + ' class="flow-label" fill="' + labelFill + '" font-size="11" data-label-edge="' + edge.id + '"'
                + ' style="pointer-events:' + (store.editMode ? 'auto;cursor:pointer' : 'none') + '">'
                + (edge.label || '').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</text>';
              edgesHtml += '</g>';
            }
            this.$refs.edgesGroup.innerHTML = edgesHtml;

            // Build nodes SVG (foreignObject with HTML content)
            var nodesHtml = '';
            for (var i = 0; i < this.nodes.length; i++) {
              var node = this.nodes[i];
              var displayName = store.edits.pageDisplayNames[node.id] || node.name;
              var isAdding = self.addingConnection && self.addingConnection.sourceId === node.id;
              var nodeClass = 'flow-node border-2 rounded-lg overflow-hidden shadow-sm h-full node-type-' + node.pageType;
              if (isAdding) nodeClass += ' flow-node-adding ring-2 ring-blue-500';
              var imgSrc = store.getScreenshotSrc(node.id, 'default');
              nodesHtml += '<foreignObject x="' + node.x + '" y="' + node.y + '" width="' + self.nodeWidth + '" height="' + self.nodeHeight + '" data-node-id="' + node.id + '">';
              nodesHtml += '<div xmlns="http://www.w3.org/1999/xhtml" class="' + nodeClass + '" style="cursor:pointer">';
              nodesHtml += '<div class="bg-gray-100 dark:bg-gray-700 flex items-center justify-center" style="height:50px">';
              nodesHtml += '<img src="' + imgSrc + '" loading="lazy" class="w-full h-full object-contain screenshot-thumb" style="max-height:50px" onerror="this.style.display=\'none\'"/>';
              nodesHtml += '</div>';
              nodesHtml += '<div class="px-2 py-1 text-xs text-center truncate dark:text-gray-200' + (store.editMode ? ' editable-hint' : '') + '"'
                + ' data-name-node="' + node.id + '">'
                + displayName.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>';
              nodesHtml += '</div></foreignObject>';
            }
            this.$refs.nodesGroup.innerHTML = nodesHtml;
          },

          handleSvgClick: function(event) {
            var target = event.target;
            while (target && target !== this.$refs.flowSvg) {
              if (target.dataset) {
                if (target.dataset.edgeId) {
                  event.stopPropagation();
                  this.handleEdgeClick(target.dataset.edgeId);
                  return;
                }
              }
              if (target.closest) {
                var nodeEl = target.closest('[data-node-id]');
                if (nodeEl) {
                  event.stopPropagation();
                  this.handleNodeClick(nodeEl.dataset.nodeId);
                  return;
                }
              }
              target = target.parentElement;
            }
            this.selectedEdge = null;
          },

          handleSvgDblClick: function(event) {
            if (!this.$store.review.editMode) return;
            var target = event.target;
            while (target && target !== this.$refs.flowSvg) {
              if (target.dataset) {
                if (target.dataset.labelEdge) {
                  event.stopPropagation();
                  this.startLabelEdit(target.dataset.labelEdge);
                  return;
                }
              }
              if (target.closest) {
                var nameEl = target.closest('[data-name-node]');
                if (nameEl) {
                  event.stopPropagation();
                  this.startNameEdit(nameEl.dataset.nameNode);
                  return;
                }
              }
              target = target.parentElement;
            }
          },

          startLabelEdit: function(edgeId) {
            this.editingLabel = edgeId;
            var self = this;
            var edge = null;
            for (var i = 0; i < this.edges.length; i++) {
              if (this.edges[i].id === edgeId) { edge = this.edges[i]; break; }
            }
            if (!edge) return;
            setTimeout(function() {
              var input = self.$refs.labelEditInput;
              if (input) {
                input.value = edge.label || '';
                input.focus();
                input.select();
              }
            }, 50);
          },

          saveLabelEdit: function(value) {
            if (this.editingLabel) {
              this.$store.review.updateEdit('connectionLabels', this.editingLabel, value);
              this.editingLabel = null;
              this.computeLayout();

          },

          startNameEdit: function(nodeId) {
            this.editingNodeName = nodeId;
            var self = this;
            var node = null;
            for (var i = 0; i < this.nodes.length; i++) {
              if (this.nodes[i].id === nodeId) { node = this.nodes[i]; break; }
            }
            if (!node) return;
            var displayName = this.$store.review.edits.pageDisplayNames[nodeId] || node.name;
            setTimeout(function() {
              var input = self.$refs.nameEditInput;
              if (input) {
                input.value = displayName;
                input.focus();
                input.select();
              }
            }, 50);
          },

          saveNameEdit: function(value) {
            if (this.editingNodeName) {
              this.$store.review.updateEdit('pageDisplayNames', this.editingNodeName, value);
              this.editingNodeName = null;
              this.computeLayout();
            }
          },

          getOverlayStyle: function(id, overlayType) {
            if (!id || !this.$refs.flowSvg) return 'display:none';
            var svg = this.$refs.flowSvg;
            var svgRect = svg.getBoundingClientRect();
            var containerRect = svg.parentElement.getBoundingClientRect();
            // Compute scale from viewBox to rendered size
            var scaleX = svgRect.width / (this.svgWidth || 1);
            var scaleY = svgRect.height / (this.svgHeight || 1);

            if (overlayType === 'actionBar') {
              var edge = null;
              for (var i = 0; i < this.edges.length; i++) {
                if (this.edges[i].id === id) { edge = this.edges[i]; break; }
              }
              if (!edge) return 'display:none';
              var x = edge.labelX * scaleX + (svgRect.left - containerRect.left) - 90;
              var y = edge.labelY * scaleY + (svgRect.top - containerRect.top) - 40;
              return 'left:' + x + 'px;top:' + y + 'px';
            }
            if (overlayType === 'labelEdit') {
              var edge = null;
              for (var i = 0; i < this.edges.length; i++) {
                if (this.edges[i].id === id) { edge = this.edges[i]; break; }
              }
              if (!edge) return 'display:none';
              var x = edge.labelX * scaleX + (svgRect.left - containerRect.left) - 60;
              var y = edge.labelY * scaleY + (svgRect.top - containerRect.top) - 12;
              return 'left:' + x + 'px;top:' + y + 'px';
            }
            if (overlayType === 'nameEdit') {
              var node = null;
              for (var i = 0; i < this.nodes.length; i++) {
                if (this.nodes[i].id === id) { node = this.nodes[i]; break; }
              }
              if (!node) return 'display:none';
              var x = node.x * scaleX + (svgRect.left - containerRect.left);
              var y = (node.y + 50) * scaleY + (svgRect.top - containerRect.top);
              return 'left:' + x + 'px;top:' + y + 'px';
            }
            if (overlayType === 'addConn') {
              var node = null;
              for (var i = 0; i < this.nodes.length; i++) {
                if (this.nodes[i].id === id) { node = this.nodes[i]; break; }
              }
              if (!node) return 'display:none';
              var x = node.x * scaleX + (svgRect.left - containerRect.left);
              var y = (node.y + this.nodeHeight + 4) * scaleY + (svgRect.top - containerRect.top);
              return 'left:' + x + 'px;top:' + y + 'px';
            }
            return 'display:none';
          },

          edgePath: function(sx, sy, tx, ty) {
            var x1 = sx + this.nodeWidth;
            var y1 = sy + this.nodeHeight / 2;
            var x2 = tx;
            var y2 = ty + this.nodeHeight / 2;
            var cpOffset = Math.abs(x2 - x1) * 0.4;
            return 'M ' + x1 + ' ' + y1 + ' C ' + (x1 + cpOffset) + ' ' + y1 + ', ' + (x2 - cpOffset) + ' ' + y2 + ', ' + x2 + ' ' + y2;
          },

          updateViewBox: function() {
            if (this.svgWidth === 0) return;
            this.viewBox = '0 0 ' + (this.svgWidth / this.zoom) + ' ' + (this.svgHeight / this.zoom);
          },

          zoomIn: function() {
            this.zoom = Math.min(3, this.zoom + 0.2);
            this.updateViewBox();
          },
          zoomOut: function() {
            this.zoom = Math.max(0.3, this.zoom - 0.2);
            this.updateViewBox();
          },
          zoomReset: function() {
            this.zoom = 1;
            this.updateViewBox();
          },

          handleNodeClick: function(pageId) {
            // Add-connection workflow intercepts node clicks
            if (this.addingConnection) {
              if (this.addingConnection.step === 'selectSource') {
                this.addingConnection = { sourceId: pageId, step: 'selectTarget' };
              } else if (this.addingConnection.step === 'selectTarget') {
                if (pageId === this.addingConnection.sourceId) return; // cannot self-link
                this.addingConnection = {
                  sourceId: this.addingConnection.sourceId,
                  targetId: pageId,
                  step: 'confirmDialog'
                };
              }
              return;
            }
            this.$store.review.view = 'detail';
            setTimeout(function() {
              var el = document.getElementById('page-card-' + pageId);
              if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
          },

          handleEdgeClick: function(edgeId) {
            if (!this.$store.review.editMode) {
              this.selectedEdge = null;
              return;
            }

          },

          deleteConnection: function(connId) {
            this.$store.review.updateEdit('deletedConnections', connId, true);
            this.selectedEdge = null;
            this.computeLayout();
          },

          confirmNewConnection: function() {
            var ac = this.addingConnection;
            if (!ac || !ac.sourceId || !ac.targetId) return;
            var typeEl = this.$refs.newConnType;
            var labelEl = this.$refs.newConnLabel;
            var connType = typeEl ? typeEl.value : 'navigation';
            var connLabel = labelEl ? labelEl.value : '';
            var newConn = {
              id: 'conn-' + ac.sourceId + '--' + ac.targetId + '-' + Date.now(),
              from: ac.sourceId,
              to: ac.targetId,
              type: connType,
              label: connLabel
            };
            this.$store.review.updateEdit('newConnections', null, newConn);
            this.addingConnection = null;
            this.computeLayout();
          },

          getLinearConnections: function() {
            var store = this.$store.review;
            var pages = (store.data && store.data.pages) ? store.data.pages : [];
            var connections = (store.data && store.data.connections) ? store.data.connections : [];
            var pageMap = {};
            for (var i = 0; i < pages.length; i++) {
              pageMap[pages[i].id] = store.edits.pageDisplayNames[pages[i].id] || pages[i].name;
            }
            var result = [];
            for (var i = 0; i < connections.length; i++) {
              var c = connections[i];
              if (store.edits.deletedConnections[c.id]) continue;
              var label = store.getConnectionLabel ? store.getConnectionLabel(c.id) : (c.label || '');
              var type = store.getConnectionType ? store.getConnectionType(c.id) : (c.type || 'navigation');
              result.push({
                id: c.id,
                fromName: pageMap[c.from] || c.from,
                toName: pageMap[c.to] || c.to,
                label: label,
                type: type
              });
            }
            var newConns = store.edits.newConnections || [];
            for (var i = 0; i < newConns.length; i++) {
              var c = newConns[i];
              result.push({
                id: c.id,
                fromName: pageMap[c.from] || c.from,
                toName: pageMap[c.to] || c.to,
                label: c.label || '',
                type: c.type || 'navigation'
              });
            }
            return result;
          }
        };
      });

      Alpine.data('detailView', function() {
        return {
          currentPageIndex: 0,
          expandedFeatures: {},
          openComments: {},
          commentText: {},

          init: function() {
            var self = this;
            var store = this.$store.review;
            // Default all features expanded
            if (store.data && store.data.pages) {
              self._initExpanded(store.data.pages);
            }
            // Re-init if data loads after component (async path)
            this.$watch('$store.review.data', function(newData) {
              if (newData && newData.pages) {
                self._initExpanded(newData.pages);
              }
            });
          },

          _initExpanded: function(pages) {
            var expanded = {};
            for (var i = 0; i < pages.length; i++) {
              var features = pages[i].features || [];
              for (var j = 0; j < features.length; j++) {
                expanded[features[j].id] = true;
              }
            }
            this.expandedFeatures = expanded;
          },

          isExpanded: function(featId) {
            return this.expandedFeatures[featId] !== false;
          },

          toggleExpand: function(featId) {
            var val = this.expandedFeatures[featId] !== false ? false : true;
            this.expandedFeatures = Object.assign({}, this.expandedFeatures, (function() {
              var o = {}; o[featId] = val; return o;
            })());
          },

          expandAll: function() {
            var expanded = {};
            var store = this.$store.review;
            if (store.data && store.data.pages) {
              for (var i = 0; i < store.data.pages.length; i++) {
                var feats = this.getEffectiveFeatures(store.data.pages[i].id);
                for (var j = 0; j < feats.length; j++) {
                  expanded[feats[j].id] = true;
                }
              }
            }
            this.expandedFeatures = expanded;
          },

          collapseAll: function() {
            this.expandedFeatures = {};
          },

          getEffectiveFeatures: function(pageId) {
            var store = this.$store.review;
            if (!store.data || !store.data.pages) return [];
            var page = store.data.pages.find(function(p) { return p.id === pageId; });
            var original = (page && page.features) ? page.features.slice() : [];

            // Filter out deleted
            var deleted = store.edits.deletedFeatures[pageId] || {};
            var filtered = original.filter(function(f) { return !deleted[f.id]; });

            // Append new features
            var added = store.edits.newFeatures[pageId] || [];
            var merged = filtered.concat(added);

            // Apply custom order if exists
            var order = store.edits.featureOrder[pageId];
            if (order && order.length > 0) {
              var orderMap = {};
              for (var i = 0; i < order.length; i++) {
                orderMap[order[i]] = i;
              }
              merged.sort(function(a, b) {
                var aIdx = orderMap[a.id] !== undefined ? orderMap[a.id] : 9999;
                var bIdx = orderMap[b.id] !== undefined ? orderMap[b.id] : 9999;
                return aIdx - bIdx;
              });
            }

            return merged;
          },

          getFeatureScreenshot: function(pageId, featureId) {
            return this.$store.review.getFeatureScreenshotSrc(pageId, featureId);
          },

          openLightbox: function(src) {
            if (src) this.$store.review.openLightbox(src);
          },

          // --- Comment interaction methods (EDIT-DETAIL-10) ---

          toggleComments: function(featId) {
            var val = !this.openComments[featId];
            this.openComments = Object.assign({}, this.openComments, (function() {
              var o = {}; o[featId] = val; return o;
            })());
          },

          isCommentsOpen: function(featId) {
            return !!this.openComments[featId];
          },

          submitComment: function(pageId, featId) {
            var text = this.commentText[featId] || '';
            if (!text.trim()) return;
            this.$store.review.addFeatureComment(pageId, featId, text);
            this.commentText = Object.assign({}, this.commentText, (function() {
              var o = {}; o[featId] = ''; return o;
            })());
          },

          updateCommentText: function(featId, value) {
            this.commentText = Object.assign({}, this.commentText, (function() {
              var o = {}; o[featId] = value; return o;
            })());
          },

          // --- Edit action methods (EDIT-DETAIL-06/07/08/05) ---

          addFeature: function(pageId) {
            var newFeat = {
              id: 'new-' + generateId(),
              name: '\u65B0\u529F\u80FD\u70B9',
              description: '',
              notes: '',
            };
            var existing = (this.$store.review.edits.newFeatures[pageId] || []).slice();
            existing.push(newFeat);
            this.$store.review.updateEdit('newFeatures', pageId, existing);
            // Auto-expand the new feature
            var exp = Object.assign({}, this.expandedFeatures);
            exp[newFeat.id] = true;
            this.expandedFeatures = exp;
          },

          deleteFeature: function(pageId, featureId) {
            if (!confirm('\u786E\u5B9A\u5220\u9664\u6B64\u529F\u80FD\u70B9\uFF1F')) return;
            var deleted = Object.assign({}, this.$store.review.edits.deletedFeatures[pageId] || {});
            deleted[featureId] = true;
            this.$store.review.updateEdit('deletedFeatures', pageId, deleted);
          },

          moveFeature: function(pageId, featureId, direction) {
            var features = this.getEffectiveFeatures(pageId);
            var ids = features.map(function(f) { return f.id; });
            var idx = ids.indexOf(featureId);
            if (idx < 0) return;
            var newIdx = idx + direction;
            if (newIdx < 0 || newIdx >= ids.length) return;
            var temp = ids[idx];
            ids[idx] = ids[newIdx];
            ids[newIdx] = temp;
            this.$store.review.updateEdit('featureOrder', pageId, ids);
          },

          handleFeatureScreenshotUpload: function(event, pageId, featureId) {
            var file = event.target && event.target.files ? event.target.files[0] : null;
            if (!file || file.type.indexOf('image/') !== 0) return;
            this.$store.review._saveFeatureScreenshot(file, pageId, featureId);
            event.target.value = '';
          },

          handleFeatureScreenshotDrop: function(event, pageId, featureId) {
            event.preventDefault();
            var file = event.dataTransfer && event.dataTransfer.files ? event.dataTransfer.files[0] : null;
            if (!file || file.type.indexOf('image/') !== 0) return;
            this.$store.review._saveFeatureScreenshot(file, pageId, featureId);
          },
        };
      });

            var ex = Object.assign({}, this.$store.review.edits.journeys[jIdx] || {});

            this.$store.review.updateEdit('journeys', String(jIdx), ex);

          moveStep: function(jIdx, sIdx, direction) {
            var journey = this.$store.review.data.journeys[jIdx];
            var steps = this.getEffectiveSteps(journey, jIdx).map(function(s) { return Object.assign({}, s); });
            var newIdx = sIdx + direction;
            if (newIdx < 0 || newIdx >= steps.length) return;
            var tmp = steps[sIdx];
            steps[sIdx] = steps[newIdx];
            steps[newIdx] = tmp;
            var ex = Object.assign({}, this.$store.review.edits.journeys[jIdx] || {});
            ex.steps = steps;
            this.$store.review.updateEdit('journeys', String(jIdx), ex);

            var store = this.$store.review;

            var journeyEditKeys = Object.keys(store.edits.journeys);
            var newCount = 0;
            for (var i = 0; i < journeyEditKeys.length; i++) {
              if (store.edits.journeys[journeyEditKeys[i]]._isNew) newCount++;
            }
            var newIdx = baseLen + newCount;
            var ex = { name: '\u65B0\u8DEF\u5F84', goal: '', steps: [], _isNew: true };
            store.updateEdit('journeys', String(newIdx), ex);
          },

          deleteJourney: function(jIdx) {
            if (!confirm('\u786E\u5B9A\u5220\u9664\u6B64\u8DEF\u5F84\uFF1F')) return;
            var dj = Object.assign({}, this.deletedJourneys);
            dj[jIdx] = true;
            this.deletedJourneys = dj;
            var ex = Object.assign({}, this.$store.review.edits.journeys[jIdx] || {});
            ex._deleted = true;
            this.$store.review.updateEdit('journeys', String(jIdx), ex);

            var journey = this.$store.review.data.journeys[jIdx];
            var steps = this.getEffectiveSteps(journey, jIdx).map(function(s) { return Object.assign({}, s); });
            if (!steps[sIdx]) return;
            steps[sIdx].decisionPoint = { condition: '\u6761\u4EF6', branches: [{ label: '\u5206\u652F1', targetPageId: '' }] };
            var ex = Object.assign({}, this.$store.review.edits.journeys[jIdx] || {});
            ex.steps = steps;
            this.$store.review.updateEdit('journeys', String(jIdx), ex);
          },

          deleteDecisionPoint: function(jIdx, sIdx) {
            if (!confirm('\u786E\u5B9A\u5220\u9664\u6B64\u51B3\u7B56\u70B9\uFF1F')) return;
            var journey = this.$store.review.data.journeys[jIdx];
            var steps = this.getEffectiveSteps(journey, jIdx).map(function(s) { return Object.assign({}, s); });
            if (!steps[sIdx]) return;
            delete steps[sIdx].decisionPoint;
            var ex = Object.assign({}, this.$store.review.edits.journeys[jIdx] || {});
            ex.steps = steps;
            this.$store.review.updateEdit('journeys', String(jIdx), ex);
          },

          saveDecisionCondition: function(jIdx, sIdx, value) {
            var journey = this.$store.review.data.journeys[jIdx];
            var steps = this.getEffectiveSteps(journey, jIdx).map(function(s) { return Object.assign({}, s); });
            if (!steps[sIdx] || !steps[sIdx].decisionPoint) return;
            steps[sIdx].decisionPoint = Object.assign({}, steps[sIdx].decisionPoint, { condition: value });
            var ex = Object.assign({}, this.$store.review.edits.journeys[jIdx] || {});
            ex.steps = steps;
            this.$store.review.updateEdit('journeys', String(jIdx), ex);
          },

          saveBranchLabel: function(jIdx, sIdx, bIdx, value) {
            var journey = this.$store.review.data.journeys[jIdx];
            var steps = this.getEffectiveSteps(journey, jIdx).map(function(s) { return Object.assign({}, s); });
            if (!steps[sIdx] || !steps[sIdx].decisionPoint) return;
            var branches = (steps[sIdx].decisionPoint.branches || []).map(function(b) { return Object.assign({}, b); });
            if (branches[bIdx]) branches[bIdx].label = value;
            steps[sIdx].decisionPoint = Object.assign({}, steps[sIdx].decisionPoint, { branches: branches });
            var ex = Object.assign({}, this.$store.review.edits.journeys[jIdx] || {});
            ex.steps = steps;
            this.$store.review.updateEdit('journeys', String(jIdx), ex);
          },

          saveBranchTarget: function(jIdx, sIdx, bIdx, value) {
            var journey = this.$store.review.data.journeys[jIdx];
            var steps = this.getEffectiveSteps(journey, jIdx).map(function(s) { return Object.assign({}, s); });
            if (!steps[sIdx] || !steps[sIdx].decisionPoint) return;
            var branches = (steps[sIdx].decisionPoint.branches || []).map(function(b) { return Object.assign({}, b); });
            if (branches[bIdx]) branches[bIdx].targetPageId = value;
            steps[sIdx].decisionPoint = Object.assign({}, steps[sIdx].decisionPoint, { branches: branches });
            var ex = Object.assign({}, this.$store.review.edits.journeys[jIdx] || {});
            ex.steps = steps;
            this.$store.review.updateEdit('journeys', String(jIdx), ex);
          },

          addBranch: function(jIdx, sIdx) {
            var journey = this.$store.review.data.journeys[jIdx];
            var steps = this.getEffectiveSteps(journey, jIdx).map(function(s) { return Object.assign({}, s); });

            this.$store.review.updateEdit('journeys', String(jIdx), ex);

          deleteBranch: function(jIdx, sIdx, bIdx) {
            var journey = this.$store.review.data.journeys[jIdx];
            var steps = this.getEffectiveSteps(journey, jIdx).map(function(s) { return Object.assign({}, s); });
            if (!steps[sIdx] || !steps[sIdx].decisionPoint) return;
            var branches = (steps[sIdx].decisionPoint.branches || []).map(function(b) { return Object.assign({}, b); });
            branches.splice(bIdx, 1);
            steps[sIdx].decisionPoint = Object.assign({}, steps[sIdx].decisionPoint, { branches: branches });
